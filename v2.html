<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CaliTrack">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CaliTrack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* CaliTrack — native iOS feel: system font (SF Pro on iPhone), grouped inset lists, one cobalt accent, true-black dark mode.
   Layout: one column, large titles, borderless rounded groups, translucent tab bar, floating rest timer. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#111114; --muted:#6E6E78; --line:#DCDCE3; --track:#EDEDF2;
  --accent:#2457F5; --accent-ink:#FFFFFF; --accent-text:#1E4AD9; --accent-soft:#E7EDFF;
  --good:#18924D; --good-soft:#DCF2E5; --bad:#D9363A; --bad-soft:#FCE4E4;
  --bar:rgba(249,249,251,.86); --scrim:rgba(0,0,0,.35);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#9A9AA3; --line:#38383D; --track:#2C2C2E;
  --accent:#4C7BFF; --accent-ink:#FFFFFF; --accent-text:#7FA0FF; --accent-soft:#18233F;
  --good:#3DD27A; --good-soft:#12301D; --bad:#FF5F63; --bad-soft:#3A1618;
  --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#9A9AA3; --line:#38383D; --track:#2C2C2E;
  --accent:#4C7BFF; --accent-ink:#FFFFFF; --accent-text:#7FA0FF; --accent-soft:#18233F;
  --good:#3DD27A; --good-soft:#12301D; --bad:#FF5F63; --bad-soft:#3A1618;
  --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.35;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-block:4px 210px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 0}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink)}
.brand svg{width:22px;height:22px;color:var(--accent)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--track);color:var(--ink);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.025em;margin:6px 0 16px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;letter-spacing:-.02em;margin:28px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.25;margin:0;min-width:0;overflow-wrap:anywhere}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.01em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.card{background:var(--card);border:0;border-radius:var(--r);padding:14px 16px;min-width:0}
.card.tap{text-align:left;width:100%;display:block;transition:transform .12s ease,background .12s}
.card.tap:active{transform:scale(.985);background:var(--track)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:3px 9px;border-radius:7px;background:var(--track);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--accent-text);margin-right:4px;font-weight:700}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.go{font-weight:600;color:var(--accent-text);font-size:15px;white-space:nowrap}

.btn{min-height:50px;padding:0 18px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent-text);font-weight:600;font-size:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--accent-text)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.small{min-height:38px;padding:0 12px;font-size:15px;border-radius:10px}
.btn:active{opacity:.75}
.btn:disabled{opacity:.4}
.link{background:none;border:0;padding:6px 0;color:var(--accent-text);font-weight:600;font-size:15px}

.banner{border:0;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:14px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:0;color:var(--muted);min-width:0}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .ico{display:grid;place-items:center}

/* Live session */
.sess-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.clock{font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ex .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.tempo{display:inline-flex;align-items:baseline;gap:5px;background:var(--track);color:var(--ink);border-radius:6px;padding:2px 7px;font-weight:600}
.tempo span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tempo b{font-weight:700;font-size:15px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tempo-help{font-size:12px;color:var(--muted);margin-top:4px}
.uni-tag{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:2px 6px;background:var(--track);color:var(--ink)}
.ex .note{font-size:13px;margin-top:6px;color:var(--ink)}
.ex .last{font-size:13px;margin-top:6px;color:var(--accent-text);font-weight:500}
.streak{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px}
.streak.up{background:var(--good-soft);color:var(--good)}
.streak.down{background:var(--bad-soft);color:var(--bad)}
.lvl{margin-top:10px;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.lvl.up{background:var(--accent);color:var(--accent-ink)}
.lvl.down{background:var(--bad-soft);color:var(--bad)}
.lvl .k{font-weight:700;font-size:17px;line-height:1.2}
.lvl .d{font-size:14px;font-weight:500}
.lvl .undo{align-self:flex-start;background:none;border:0;padding:4px 0;color:inherit;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 50px;gap:6px;align-items:center;min-width:0}
.set.uni{grid-template-areas:"n g d ok" "n k k ok";grid-template-rows:50px 50px}
.set.uni .n{grid-area:n}.set.uni .sg{grid-area:g}.set.uni .sd{grid-area:d}.set.uni .sk{grid-area:k}.set.uni .done{grid-area:ok;height:100%}
.set .n{font-weight:600;font-size:15px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;border-radius:10px;overflow:hidden;background:var(--track);height:50px;min-width:0}
.step button{border:0;background:transparent;font-size:22px;font-weight:500;line-height:1;padding:0;color:var(--accent-text)}
.step button:active{background:var(--line)}
.step .v{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.step input{width:100%;border:0;background:transparent;text-align:center;font-weight:700;font-size:20px;padding:0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step small{font-size:10px;color:var(--muted);line-height:1;margin-top:1px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;font-weight:500}
.done{height:50px;border-radius:10px;border:0;background:var(--track);color:var(--muted);display:grid;place-items:center}
.done svg{width:24px;height:24px}
.set.ok .done{background:var(--accent);color:var(--accent-ink)}
.set.ok .step{background:var(--accent-soft)}
.set-tools{display:flex;gap:8px;margin-top:10px}
.set-tools .btn{flex:1}
.scale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.scale button{height:48px;border-radius:10px;border:0;background:var(--track);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.scale button.hi{background:var(--bad-soft);color:var(--bad)}
.guard{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:12px 16px;font-size:14px;font-weight:600}

/* Superset / triset block */
.grp{padding:0;overflow:hidden}
.grp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:12px 16px;background:var(--accent-soft);color:var(--accent-text)}
.grp-tag{font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.grp-sub{font-size:13px;color:var(--ink);opacity:.75}
.member{padding:14px 16px}
.member+.member{border-top:.5px solid var(--line)}
.mlabel{font-weight:700;font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:2px 5px;margin-right:7px;vertical-align:2px;font-variant-numeric:tabular-nums}

/* Rest timer */
.timer{position:fixed;left:0;right:0;z-index:19;bottom:calc(58px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.timer .in{max-width:560px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.timer .next{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:0 4px 8px 0;margin-bottom:8px;border-bottom:.5px solid rgba(127,127,127,.4)}
.timer .next .tempo{background:rgba(127,127,127,.25);color:inherit;flex:none}
.timer .next .tempo span{color:inherit;opacity:.75}
.timer .next .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.timer .mainrow{display:flex;align-items:center;gap:8px}
.timer .t{font-weight:600;font-size:34px;line-height:1;flex:1;min-width:0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer.chain .t{font-size:22px}
.timer .lbl{font-size:12px;opacity:.7;display:block;font-weight:500;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.timer button{min-width:48px;height:44px;border-radius:12px;border:0;background:rgba(127,127,127,.25);color:inherit;font-weight:600;font-size:15px}
.timer.over .in{background:var(--accent);color:var(--accent-ink);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.timer.chain .in{background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.timer .bar{height:4px;border-radius:2px;background:rgba(127,127,127,.3);margin-top:7px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer.over .bar i{background:var(--accent-ink)}

.exname{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.exname::after{content:"›";margin-left:6px;color:var(--muted);font-weight:500}
.lvlnav{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.lvlnav .lv{font-size:13px;font-weight:600;flex:1 1 100%;color:var(--muted)}
.lvlnav .btn{flex:1}
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .in{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:80vh;overflow:auto;
  padding-top:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .in::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.hrow{padding:11px 0;border-top:.5px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:15px}
.hrow:first-of-type{border-top:0}
.hrow .d{font-weight:600}
.hrow .s{grid-column:1/-1;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* Progress */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--track);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;min-height:32px;font-weight:500;font-size:14px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
select.pick{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--card);padding:0 14px;font-weight:600;font-size:17px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.big .v{font-weight:700;font-size:56px;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.big .u{font-weight:600;font-size:20px;color:var(--muted)}
.delta{font-weight:700;font-size:22px;letter-spacing:-.02em}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpi .v{font-weight:700;font-size:28px;line-height:1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-nav h3{font-size:20px;font-weight:700;text-transform:capitalize}
.cal-nav .iconbtn{font-size:22px;color:var(--accent-text);background:transparent}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;max-width:100%;border:0;background:transparent;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.day.out{visibility:hidden}
.day .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.day.has .dot{background:var(--accent)}
.day.today{color:var(--accent-text);font-weight:700}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel .dot{background:var(--accent-ink)}
.day:disabled{color:var(--muted);opacity:.55}
.detail-ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:.5px solid var(--line);font-size:15px}
.detail-ex:first-of-type{border-top:0}
.detail-ex .sets-txt{grid-column:1/-1;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* Summary */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile .v{font-weight:700;font-size:40px;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.2}
.tile.hot{background:var(--accent);color:var(--accent-ink)}
.tile.hot .l{color:inherit;opacity:.85}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-top:.5px solid var(--line);align-items:baseline}
.rec:first-child{border-top:0}
.rec .name{font-weight:500;min-width:0;overflow-wrap:anywhere}
.rec .val{font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.rec .when{font-size:12px;color:var(--muted)}

/* Bilan */
.bl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:.5px solid var(--line);align-items:baseline;font-size:15px}
.bl-row:first-of-type{border-top:0}
.bl-row .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.bl-row .why{grid-column:1/-1;color:var(--muted);font-size:13px}
.verdict{font-weight:700;font-size:13px;white-space:nowrap}
.verdict.up{color:var(--accent-text)}.verdict.down{color:var(--bad)}.verdict.top{color:var(--good)}.verdict.fail{color:var(--bad)}.verdict.mid{color:var(--muted)}

/* Routines editor */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.inp{min-height:44px;border:0;border-radius:10px;background:var(--track);padding:0 12px;width:100%;min-width:0;font-size:16px}
.inp:disabled{opacity:.55}
.ex-edit{border-top:.5px solid var(--line);padding-top:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ex-edit.linked{border-top:1.5px dashed var(--accent)}
.ex-edit .full{grid-column:1/-1}
.ex-edit .tools{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.checks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px}
.check{display:flex;align-items:center;gap:8px;min-height:40px;font-size:15px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.22)}
textarea.dump{width:100%;min-height:140px;border:0;border-radius:10px;background:var(--track);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- v6 additions ---- */
.set.c3{grid-template-columns:20px minmax(0,1fr) 50px}
.set.uni.nokg{grid-template-areas:none;grid-template-rows:50px;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 50px}
.set.uni.nokg>*{grid-area:auto}
.set.uni.nokg .done{height:50px}

/* swipe to delete */
.swipe{position:relative;border-radius:var(--r);overflow:hidden}
.swipe-del{position:absolute;right:0;top:0;bottom:0;width:96px;border:0;background:var(--bad);color:#fff;font-weight:600;font-size:15px;border-radius:0 var(--r) var(--r) 0;visibility:hidden}
.swipe.open .swipe-del,.swipe.dragging .swipe-del{visibility:visible}
.swipe-fg{position:relative;z-index:1;background:var(--card);border-radius:var(--r);transition:transform .22s ease;touch-action:pan-y;will-change:transform}
.swipe.open .swipe-fg{transform:translateX(-96px);border-radius:var(--r) 0 0 var(--r)}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;background:none;border:0;min-height:60px}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.lrow .sub{font-size:13px;color:var(--muted);margin-top:2px}
.lrow .chev{color:var(--muted);font-size:20px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--accent-soft);color:var(--accent-text);margin-left:6px;vertical-align:2px}

/* alert dialog */
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px}
.modal[hidden]{display:none}
.modal .box{background:var(--card);border-radius:16px;width:100%;max-width:290px;text-align:center;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{padding:18px 16px 4px;font-size:17px;font-weight:600}
.modal p{margin:0;padding:2px 16px 16px;font-size:13px;color:var(--muted)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--line)}
.mbtns.one{grid-template-columns:1fr}
.mbtns button{border:0;background:none;min-height:46px;font-size:17px;color:var(--accent-text)}
.mbtns button+button{border-left:.5px solid var(--line)}
.mbtns .del{color:var(--bad);font-weight:600}

/* rest picker (two wheels) */
.pheads{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.picker{position:relative;display:grid;grid-template-columns:1fr 1fr;height:220px;margin:4px 0 12px}
.picker .band{position:absolute;left:8px;right:8px;top:88px;height:44px;border-radius:10px;background:var(--track);pointer-events:none}
.pcol{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:88px 0;
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.pcol::-webkit-scrollbar{display:none}
.pcol div{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-size:24px;font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer}
.pcol div.on{color:var(--ink);font-weight:600}

/* routine & exercise editors */
.ied{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ied-head{display:flex;align-items:flex-start;gap:8px}
.ied-head .mlabel{margin-top:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mstep{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;background:var(--track);border-radius:10px;height:44px;align-items:center}
.mstep button{border:0;background:none;font-size:22px;color:var(--accent-text);height:100%}
.mstep span{text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.range{display:flex;align-items:center;gap:6px}
.range .inp{text-align:center;padding:0 6px}
.range span{color:var(--muted);font-size:14px;white-space:nowrap}
.restbtn{min-height:44px;border:0;border-radius:10px;background:var(--track);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;width:100%;color:var(--accent-text)}
.sugg{margin-top:6px;border-radius:10px;background:var(--track);overflow:hidden}
.sugg[hidden]{display:none}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;font-size:15px}
.sugg button+button{border-top:.5px solid var(--line)}
.sugg .new{color:var(--accent-text);font-weight:600}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;border-top:.5px solid var(--line);font-size:16px}
.tg:first-child{border-top:0}
.tg small{display:block;font-size:12px;color:var(--muted)}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--good)}
.switch:checked::after{transform:translateX(20px)}
.switch:disabled{opacity:.4}
.seg.three{grid-template-columns:repeat(3,1fr)}
.steprow{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr);grid-template-areas:"n nm nm" "n lo hi";gap:6px;align-items:center;padding:8px 10px}
.steprow .n{grid-area:n}.steprow [data-sf=n]{grid-area:nm}.steprow [data-sf=lo]{grid-area:lo}.steprow [data-sf=hi]{grid-area:hi}
.steprow .n{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.steprow.cur .n{color:var(--accent-text)}
.steps{display:flex;flex-direction:column;gap:6px}
.steps .swipe-fg{background:var(--track)}
textarea.inp{min-height:110px;padding:10px 12px;line-height:1.4;resize:vertical}
.how{white-space:pre-wrap;font-size:15px;line-height:1.45}
.search{min-height:40px;border:0;border-radius:10px;background:var(--track);padding:0 12px;width:100%;font-size:16px}

.steps .inp{background:var(--card)}
</style>

const exById=id=>S.exercises.find(e=>e.id===id)||null;
const stepOf=ex=>ex&&ex.prog==="etapes"&&ex.steps&&ex.steps.length?ex.steps[clamp(ex.lvl||0,0,ex.steps.length-1)]:null;
const dispName=ex=>{const s=stepOf(ex);return s&&s.n?s.n:(ex?ex.name:"")};
function tgtOf(item,ex){let lo=item.lo,hi=item.hi;const s=stepOf(ex);if(s&&s.lo!=null){lo=s.lo;hi=s.hi??s.lo}if(hi!=null&&item.ext)hi+=item.ext;return{sets:Math.max(1,item.sets||1),lo,hi}}
const unitOf=m=>m==="sec"?" s":"";
function rangeTxt(lo,hi){return lo==null?"max":(hi!=null&&hi!==lo?lo+"–"+hi:String(lo))}
function tgtTxt(t,ex){
  if(ex.mode==="kick")return rangeTxt(t.lo??20,t.hi)+" tentatives";
  return t.sets+" × "+rangeTxt(t.lo,t.hi)+(t.lo==null?"":unitOf(ex.mode))+(ex.uni&&ex.mode==="reps"?" G/D":"");
}
const TEMPO=/(?:^|[\s(])(\d{1,2}-\d{1,2}-\d{1,2}(?:-\d{1,2})?)(?=$|[\s.,;)])/;
const tempoOf=(ex,note)=>{const m=((ex?ex.name:"")+" "+(note||"")).match(TEMPO);return m?m[1]:""};
const kgTxt=(kg,lest)=>(lest&&kg>0?"+":"")+fmt(kg||0)+" kg";
const routinesUsing=exId=>S.routines.filter(r=>r.items.some(i=>i.ex===exId));
function findItem(id){if(!id)return null;for(const r of S.routines)for(const i of r.items)if(i.id===id)return{r,i};return null}
function stepLabel(ex,i){const s=ex.steps[i];if(!s)return"";return (s.n||"Étape "+(i+1))+(s.lo!=null?" ("+rangeTxt(s.lo,s.hi)+unitOf(ex.mode)+")":"")}
const MODES={reps:"Reps",sec:"Secondes",kick:"Tentatives"};
const PROGS={aucun:"Aucune",signal:"Signal seulement",charge:"Charge (+ pas en kg)",duree:"Durée (+5 s)",etapes:"Étapes"};
function exSub(ex){const p=[MODES[ex.mode]];if(ex.load)p.push("charge");if(ex.uni&&ex.mode==="reps")p.push("G/D");
  if(ex.prog==="etapes"&&ex.steps.length)p.push("étape "+(clamp(ex.lvl,0,ex.steps.length-1)+1)+"/"+ex.steps.length);else if(ex.prog==="signal")p.push("signal");else if(ex.prog==="duree")p.push("+5 s");else if(ex.prog==="charge"&&!ex.load)p.push("charge");return p.join(" · ")}

const repsOf=x=>x.g!=null?Math.min(+x.g||0,+x.d||0):(+x.reps||0);
const valOf=(x,mode)=>mode==="sec"?(+x.sec||0):mode==="kick"?(+x.holds||0):repsOf(x);
function setTxt(x,e){
  if(e.mode==="kick")return (x.att??0)+" tentatives"+(x.holds!=null?" · "+x.holds+" tenues ≥ 3 s":"")+(x.best?" · max "+x.best+" s":"");
  if(e.mode==="sec")return x.sec+" s"+(x.kg?" +"+fmt(x.kg)+" kg":"");
  const r=x.g!=null?(x.g+" G / "+x.d+" D"):x.reps;
  return r+(x.kg?" × "+fmt(x.kg)+" kg":"");
}
const setsTxt=e=>e.sets.map(x=>setTxt(x,e)).join(" · ");
const sortedSessions=()=>S.sessions.slice().sort((a,b)=>(a.start||0)-(b.start||0));
function exMetric(name){let mode="reps",anyKg=false;for(const s of S.sessions)for(const e of s.exercises)if(e.name===name){mode=e.mode;if(e.sets.some(x=>(x.kg||0)>0))anyKg=true}
  if(mode==="kick")return"kick";if(mode==="sec")return"sec";return anyKg?"kg":"reps"}
function exValue(e,metric){let v=null;for(const x of e.sets){const n=metric==="kick"?(x.holds==null?null:+x.holds):metric==="kg"?(x.kg||0):metric==="sec"?(x.sec||0):repsOf(x);if(n===null)continue;if(v===null||n>v)v=n}return v}
function recValue(e,m){if(m!=="kick")return exValue(e,m);let v=null;for(const x of e.sets)if(+x.best>0&&(v===null||+x.best>v))v=+x.best;return v}
const unit=m=>m==="kg"?"kg":m==="sec"?"s":m==="kick"?"tenues":"reps";
const metricLabel=m=>m==="kg"?"Charge max":m==="sec"?"Tenue max":m==="kick"?"Tenues libres ≥ 3 s":"Répétitions max";
function lastPerf(name){const ss=sortedSessions();for(let i=ss.length-1;i>=0;i--){const e=ss[i].exercises.find(x=>x.name===name);if(e&&e.sets.length)return{e,s:ss[i]}}return null}
function sessionVolume(s){let v=0,n=0;for(const e of s.exercises)for(const x of e.sets){n++;if(e.mode!=="sec"&&e.mode!=="kick")v+=(x.g!=null?((+x.g||0)+(+x.d||0)):(x.reps||0))*(x.kg||0)}return{v,n}}
function allExNames(){const set=new Set();S.sessions.forEach(s=>s.exercises.forEach(e=>set.add(e.name)));return[...set].sort((a,b)=>a.localeCompare(b,"fr"))}

/* ================= progressive overload engine =================
   top  = every planned set reaches the HIGH end (G/D: weaker side), at the current load
   fail = fewer than half of the planned sets reach the LOW end
   2 consecutive "top" → level up ; 2 consecutive "fail" → regression. Only sessions since the last change count. */
function engineT(item,ex){if(!item||!ex||!item.auto||ex.prog==="aucun"||ex.mode==="kick")return null;const t=tgtOf(item,ex);return t.lo==null||t.hi==null?null:t}
function judge(e,item,ex,t){
  const vals=e.sets.map(x=>valOf(x,ex.mode));
  const atLoad=ex.prog!=="charge"||e.sets.every(x=>(+x.kg||0)>=(item.kg||0)-1e-9);
  const nHi=vals.filter(v=>v>=t.hi).length,nLo=vals.filter(v=>v>=t.lo).length;
  if(atLoad&&nHi>=t.sets)return"top";if(nLo<Math.ceil(t.sets/2))return"fail";return"mid";
}
function history(item,ex){const nm=dispName(ex);return sortedSessions().filter(s=>(s.start||0)>(item.since||0)).map(s=>({s,e:s.exercises.find(x=>x.rx===item.id&&x.name===nm)})).filter(h=>h.e).reverse()}
function streakOf(item,ex){const t=engineT(item,ex);if(!t)return null;const h=history(item,ex);if(!h.length)return null;const j=judge(h[0].e,item,ex,t);return j==="mid"?null:j}
function applyVerdict(item,ex,dir,at){
  const before={kg:item.kg,lo:item.lo,hi:item.hi,ext:item.ext||0,lvl:ex.lvl};
  let from="",to="",auto=false,msg="",alt=false,shared=false;
  if(ex.prog==="etapes"&&ex.steps.length){
    const nl=clamp((ex.lvl||0)+(dir==="up"?1:-1),0,ex.steps.length-1);
    if(nl!==ex.lvl){from=stepLabel(ex,ex.lvl);ex.lvl=nl;to=stepLabel(ex,nl);auto=true;shared=true}
    else msg=dir==="up"?"Dernière étape atteinte : ajoute une étape plus dure dans la fiche de l'exercice.":"Première étape : ajoute une étape plus facile dans la fiche de l'exercice.";
  }else if(ex.prog==="charge"&&ex.halt&&item.ext>0&&dir==="up"){
    from=tgtTxt(tgtOf(item,ex),ex)+" à "+kgTxt(item.kg,ex.lest);item.ext=0;item.kg=r2((item.kg||0)+(ex.incr||1));to=tgtTxt(tgtOf(item,ex),ex)+" à "+kgTxt(item.kg,ex.lest);auto=true;
  }else if(ex.prog==="charge"){
    if(dir==="down")item.ext=0;
    const nk=Math.max(0,r2((item.kg||0)+(dir==="up"?1:-1)*(ex.incr||2.5)));
    if(nk!==(item.kg||0)){from=kgTxt(item.kg,ex.lest);item.kg=nk;to=kgTxt(nk,ex.lest);auto=true;alt=dir==="up"&&!!ex.halt}
    else msg="Déjà sans charge : passe à une variante plus facile.";
  }else if(ex.prog==="duree"&&item.lo!=null){
    const d=dir==="up"?5:-5;const lo=Math.max(5,item.lo+d),hi=Math.max(lo,(item.hi??item.lo)+d);
    if(lo!==item.lo||hi!==item.hi){from=tgtTxt(tgtOf(item,ex),ex);item.lo=lo;item.hi=hi;to=tgtTxt(tgtOf(item,ex),ex);auto=true}
    else msg="Durée minimale atteinte : passe à une variante plus facile.";
  }else msg=dir==="up"?"Augmente la difficulté : lest, tempo plus lent, amplitude plus grande ou variante plus dure.":"Réduis la difficulté : assistance, amplitude réduite ou variante plus facile.";
  const p={dir,auto,from,to,msg,before,alt,at,exId:ex.id};
  item.since=at;item.pending=p;
  /* a step change applies to the exercise everywhere: the other routines show it too */
  if(shared)S.routines.forEach(r=>r.items.forEach(o=>{if(o!==item&&o.ex===ex.id){o.since=at;o.pending=JSON.parse(JSON.stringify(p))}}));
  return p;
}
function runEngine(s,dexs){
  const items=[];let touched=false;
  dexs.forEach(de=>{
    const f=findItem(de.item);if(!f)return;const item=f.i;const ex=exById(item.ex);if(!ex)return;
    if(item.pending){item.pending=null;touched=true}
    const nm=dispName(ex);const le=s.exercises.find(x=>x.rx===item.id&&x.name===nm);if(!le)return;
    if(ex.prog==="charge"){const ks=[...new Set(le.sets.map(x=>+x.kg||0))];if(ks.length===1&&ks[0]!==(item.kg||0)){item.kg=ks[0];item.since=s.start-1;touched=true}}
    const t=engineT(item,ex);if(!t)return;const h=history(item,ex);if(!h.length)return;
    const j=judge(h[0].e,item,ex,t),j2=h.length>=2?judge(h[1].e,item,ex,t):null;
    const it={name:nm,j};let dir=null;
    if(j==="top"&&j2==="top")dir="up";else if(j==="fail"&&j2==="fail")dir="down";
    if(dir){Object.assign(it,{verdict:dir},applyVerdict(item,ex,dir,s.end));touched=true}
    items.push(it);
  });
  const order={up:0,down:1,top:2,fail:3,mid:4};
  items.sort((a,b)=>order[a.verdict||a.j]-order[b.verdict||b.j]);
  return{items,touched};
}

function buildDraftEx(item,ex){
  const t=tgtOf(item,ex);const nm=dispName(ex);const lp=lastPerf(nm);
  const fresh=!!item.pending&&!item.pending.keepPrefill;const uni=!!ex.uni&&ex.mode==="reps";
  const base=t.lo??(ex.mode==="sec"?30:10);const sets=[];
  if(ex.mode==="kick"){const p=lp&&lp.e.sets[0];sets.push({att:t.lo??20,holds:p&&p.holds!=null?p.holds:0,best:p&&p.best!=null?p.best:0,done:false})}
  else for(let i=0;i<t.sets;i++){
    const p=lp&&!fresh?(lp.e.sets[i]||lp.e.sets[lp.e.sets.length-1]):null;
    const kg=ex.load?(ex.prog==="charge"&&item.id?(item.kg||0):(p?(+p.kg||0):(item.kg||0))):0;
    if(ex.mode==="sec")sets.push({sec:p?(p.sec||base):base,kg,done:false});
    else if(uni)sets.push({g:p?(p.g??p.reps??base):base,d:p?(p.d??p.reps??base):base,kg,done:false});
    else sets.push({reps:p?(p.reps??repsOf(p)):base,kg,done:false});
  }
  return{item:item.id||null,ex:ex.id,name:nm,mode:ex.mode,uni,load:!!ex.load,lest:!!ex.lest,tgt:item.id?tgtTxt(t,ex):"",rest:item.rest||90,link:!!item.link,note:item.note||"",

}

/* ===== rest timer (rest after a set, or after a full superset round) ===== */
let audioCtx=null,overShown=false,beepPending=false,lastNextKey="";
function nextUp(){if(!draft)return null;for(const bl of blocks(draft.exercises)){const R=Math.max(0,...bl.map(i=>draft.exercises[i].sets.length));for(let r=0;r<R;r++)for(const i of bl){const s=draft.exercises[i].sets[r];if(s&&!s.done)return{ei:i,si:r}}}return null}
function unlockAudio(){try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}audioCtx&&audioCtx.resume&&audioCtx.resume()}catch(e){}}
function startTimer(sec,label){draft.timer={kind:"rest",end:Date.now()+sec*1000,total:sec,label};saveDraft();overShown=false;unlockAudio();showTimer()}
function startChain(label){draft.timer={kind:"chain",start:Date.now(),label};saveDraft();showTimer()}
function stopTimer(){if(draft){draft.timer=null;saveDraft()}const el=$("#timer");el.hidden=true;el.classList.remove("over","chain")}
function beep(){try{if(!audioCtx)return;const t=audioCtx.currentTime;[0,.22,.44].forEach(o=>{const g=audioCtx.createGain(),os=audioCtx.createOscillator();os.frequency.value=880;os.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.3,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.18);os.start(t+o);os.stop(t+o+.2)})}catch(e){}}
function paintNext(){
  const n=nextUp();const el=$("#timerNext");const key=n?n.ei+"-"+n.si+"-"+draft.exercises[n.ei].name:"none";
  if(key===lastNextKey)return;lastNextKey=key;
  if(!n){el.innerHTML=`<span class="nm">Toutes les séries sont faites · termine la séance</span>`;return}
  const e=draft.exercises[n.ei];
  el.innerHTML=`<span class="nm">Ensuite : ${esc(e.name)} · série ${n.si+1}</span>${e.tempo?tempoHTML(e.tempo):'<span style="opacity:.7;white-space:nowrap">tempo libre</span>'}`;
}
function showTimer(){
  const T=draft&&draft.timer;const el=$("#timer");if(!T){el.hidden=true;return}
  el.hidden=false;paintNext();
  if(T.kind==="chain"){el.classList.add("chain");el.classList.remove("over");$("#timerBarWrap").hidden=true;$("#tMinus").hidden=true;$("#tPlus").hidden=true;
    const s=(Date.now()-T.start)/1000;$("#timerLbl").textContent="Enchaîne · pas de repos · "+mmss(s);$("#timerVal").textContent=T.label;if(s>300)stopTimer();return}
  el.classList.remove("chain");$("#timerBarWrap").hidden=false;$("#tMinus").hidden=false;$("#tPlus").hidden=false;
  const left=(T.end-Date.now())/1000;
  $("#timerLbl").textContent=left>0?("Repos · "+T.label):"Repos terminé · c'est reparti";
  $("#timerVal").textContent=left>0?mmss(Math.ceil(left)):"+"+mmss(-left);
  $("#timerBar").style.width=Math.max(0,Math.min(100,100*(1-left/T.total)))+"%";
  if(left<=0&&!overShown){overShown=true;el.classList.add("over");try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}if(document.hidden)beepPending=true;else beep()}
  if(left>0)el.classList.remove("over");if(left<-60)stopTimer();
}
function onSetDone(ei,si){
  const all=blocks(draft.exercises);const bl=all.find(b=>b.includes(ei));
  if(bl.length===1){startTimer(draft.exercises[ei].rest||90,draft.exercises[ei].name);return}
  const part=bl.filter(i=>draft.exercises[i].sets.length>si);
  if(part.every(i=>draft.exercises[i].sets[si].done)){const last=draft.exercises[part[part.length-1]];const k=all.filter(b=>b.length>1).indexOf(bl);startTimer(last.rest||90,grpName(bl.length)+" "+LETTERS[k%10]+" · tour "+(si+1)+" fini")}
  else{const nxt=part.find(i=>!draft.exercises[i].sets[si].done&&i>ei)??part.find(i=>!draft.exercises[i].sets[si].done);startChain("→ "+draft.exercises[nxt].name)}
}
setInterval(()=>{showTimer();const c=document.getElementById("clock");if(c&&draft)c.textContent=mmss((Date.now()-draft.startedAt)/1000)},250);
$("#tMinus").addEventListener("click",()=>{if(draft&&draft.timer&&draft.timer.kind==="rest"){draft.timer.end-=15000;saveDraft();showTimer()}});
$("#tPlus").addEventListener("click",()=>{if(draft&&draft.timer&&draft.timer.kind==="rest"){draft.timer.end+=15000;draft.timer.total+=15;overShown=false;saveDraft();showTimer()}});

let wakeLock=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;if(draft)keepAwake(true);try{audioCtx&&audioCtx.resume&&audioCtx.resume()}catch(e){}if(beepPending){beepPending=false;showTimer();beep()}});

function vProgress(){

  if(!ui.exo||!names.includes(ui.exo))ui.exo=names[0];
  const metric=exMetric(ui.exo);const from=new Date(today());from.setMonth(from.getMonth()-ui.period);
  const pts=sortedSessions().filter(s=>(s.start||parseISO(s.date).getTime())>=from.getTime()).map(s=>{const e=s.exercises.find(x=>x.name===ui.exo);const v=e?exValue(e,metric):null;return v!=null?{t:s.start||parseISO(s.date).getTime(),v,date:s.date}:null}).filter(Boolean);
  let head;
  if(pts.length){const cur=pts[pts.length-1].v,d=cur-pts[0].v;const cls=d>0?"up":d<0?"down":"flat";
    head=`<div class="eyebrow" style="padding-left:0">${metricLabel(metric)} · dernière séance</div>
      <div class="big"><span class="v num">${fmt(cur)}</span><span class="u">${unit(metric)}</span><span class="delta ${cls} num">${d>0?"+":d<0?"−":"±"}${fmt(Math.abs(d))} ${unit(metric)}</span></div>
      <div class="muted" style="font-size:13px">Depuis le ${fmtDateShort(pts[0].date)} · ${pts.length} séance${pts.length>1?"s":""} sur la période${metric==="reps"?" · en G / D, le côté le plus faible compte":""}</div>`;
  }else head=`<div class="muted">Aucune séance avec cet exercice sur cette période.</div>`;
  const last=sortedSessions().pop();let lastCard="";
  if(last){const vol=sessionVolume(last);
    lastCard=`<h2>Dernière séance</h2><div class="card"><div class="card-head"><h3>${esc(last.routine)}</h3><span class="muted" style="font-size:14px">${DAYS[parseISO(last.date).getDay()]} ${fmtDateShort(last.date)}</span></div>
      <div class="kpis"><div class="kpi"><div class="v num">${last.exercises.length}</div><div class="l">exercices</div></div><div class="kpi"><div class="v num">${vol.n}</div><div class="l">séries</div></div><div class="kpi"><div class="v num">${nf2.format(vol.v/1000)}</div><div class="l">tonnes soulevées</div></div></div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">Volume = répétitions × charge saisie (G + D pour l'unilatéral). Pour le lesté, seule la charge ajoutée compte.</p></div>`}
  return `<h1>Progrès</h1><div class="stack">
    <select class="pick" id="exoPick" aria-label="Exercice">${names.map(n=>`<option ${n===ui.exo?"selected":""}>${esc(n)}</option>`).join("")}</select>
    <div class="seg" role="group" aria-label="Période">${[1,3,6].map(p=>`<button data-act="period" data-p="${p}" aria-pressed="${ui.period===p}">${p} mois</button>`).join("")}</div>
    <div class="card">${head}${pts.length?chart(pts,from.getTime(),Date.now(),metric):""}</div>${lastCard}</div>`;
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chart(pts,t0,t1,metric){
  const W=340,H=210,L=40,R=14,T=14,B=28;
  let vmin=Math.min(...pts.map(p=>p.v)),vmax=Math.max(...pts.map(p=>p.v));
  if(vmax===vmin){vmax+=metric==="kg"?2.5:2;vmin=Math.max(0,vmin-(metric==="kg"?2.5:2))}
  const step=niceStep((vmax-vmin)/3);const y0=Math.floor(vmin/step)*step,y1=Math.ceil(vmax/step)*step;
  const Xs=t=>L+(W-L-R)*(t-t0)/(t1-t0),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));let g="";
  for(let v=y0;v<=y1+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--track)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${fmt(v)}</text>`}
  const m=new Date(t0);m.setDate(1);m.setMonth(m.getMonth()+1);const months=[];while(m.getTime()<=t1){months.push(new Date(m));m.setMonth(m.getMonth()+1)}
  const every=months.length>4?2:1;
  months.forEach((d,i)=>{const x=Xs(d.getTime());g+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="var(--track)" stroke-width="1" stroke-dasharray="2 3"/>`;if(i%every===0)g+=`<text x="${x}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${MSHORT[d.getMonth()]}</text>`});
  const line=pts.map((p,i)=>(i?"L":"M")+Xs(p.t).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=line+` L${Xs(pts[pts.length-1].t).toFixed(1)} ${H-B} L${Xs(pts[0].t).toFixed(1)} ${H-B} Z`;
  const dots=pts.map(p=>`<circle cx="${Xs(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="var(--card)" stroke="var(--accent)" stroke-width="1.6"/>`).join("");const lp=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${metricLabel(metric)} sur la période"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${g}<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)" stroke-width="1.2"/><path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}<circle cx="${Xs(lp.t)}" cy="${Y(lp.v)}" r="5.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/></svg>`;
}

       <div class="muted" style="font-size:13px;margin:2px 0 8px">${dur?dur+" min · ":""}${s.exercises.length} exercices · ${vol.n} séries · ${nf2.format(vol.v/1000)} t${s.wrist!=null?" · poignets "+s.wrist+"/10":""}</div>
       ${s.exercises.map(e=>`<div class="detail-ex"><b>${esc(e.name)}${e.tempo?` <span class="muted" style="font-weight:500">· ${esc(e.tempo)}</span>`:""}</b><span class="muted">${e.sets.length} série${e.sets.length>1?"s":""}</span><span class="sets-txt">${esc(setsTxt(e))}</span></div>`).join("")}</div>`)}).join("")
      +`<p class="muted" style="font-size:13px;margin:0;padding-left:4px">Glisse une séance vers la gauche pour la supprimer.</p>`;
  }
  const recs=allExNames().map(nm=>{const mm=exMetric(nm);let best=null;sortedSessions().forEach(s=>{const e=s.exercises.find(x=>x.name===nm);if(!e)return;const v=recValue(e,mm);if(v==null)return;if(best===null||v>best.v)best={v,date:s.date}});return{nm,mm,best}}).filter(r=>r.best);
  return `<h1>Historique</h1><div class="stack">

    <button class="btn danger block" data-act="wipe">Tout effacer</button></div></div>`;

/* ================= export / import ================= */
function exportData(){return JSON.stringify({app:"calitrack",version:6,exportedAt:new Date().toISOString(),exercises:S.exercises,routines:S.routines,sessions:S.sessions},null,1)}
function csvData(){
  const nn=v=>v==null||v===""?"":String(v).replace(".",",");const q=s=>{s=String(s??"");return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[["Date","Routine","Exercice","Série","Reps","Reps G","Reps D","Secondes","Charge (kg)","Tentatives","Tenues ≥ 3 s","Meilleure tenue (s)","Tempo"].join(";")];
  sortedSessions().forEach(s=>s.exercises.forEach(e=>e.sets.forEach((x,i)=>{lines.push([s.date,q(s.routine),q(e.name),i+1,nn(x.reps),nn(x.g),nn(x.d),nn(x.sec),nn(x.kg),nn(x.att),nn(x.holds),nn(x.best),q(e.tempo||"")].join(";"))})));
  return{csv:"﻿"+lines.join("\r\n"),rows:lines.length-1};
}
async function doExport(kind){
  let data,name;
  if(kind==="csv"){const c=csvData();if(!c.rows){toast("Aucune séance à exporter.");return}data=c.csv;name="calitrack-"+iso(today())+".csv"}else{data=exportData();name="calitrack-"+iso(today())+".json"}
  if(!window.claude){
    const type=kind==="csv"?"text/csv":"application/json";
    try{const f=new File([data],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast("Fichier prêt : "+name);return}catch(e){}
  }
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data});toast("Sauvegarde enregistrée.");return}catch(e){if(e&&e.code==="declined")return}}
  const box=$("#dumpBox");if(!box)return;box.hidden=false;
  box.innerHTML=`<p class="muted" style="font-size:13px;margin:0 0 6px">Le téléchargement n'est pas disponible ici. Copie ce texte dans un fichier nommé ${esc(name)}.</p><textarea class="dump" id="dump" readonly aria-label="Données exportées">${esc(data)}</textarea><button class="btn small" data-act="copy" style="margin-top:6px">Copier</button>`;
}

function handleImport(text){

    importPayload=v;const full=Array.isArray(v.exercises)&&Array.isArray(v.routines);

/* ================= swipe to delete ================= */
let sw=null,swOpen=null,swSuppress=0;
function closeSwipe(){if(swOpen){swOpen.classList.remove("open");swOpen=null}}
document.addEventListener("pointerdown",ev=>{
  const fg=ev.target.closest(".swipe-fg");
  if(swOpen&&!ev.target.closest(".swipe-del")&&(!fg||fg.parentElement!==swOpen))closeSwipe();
  if(!fg||ev.button>0||ev.target.closest("input,textarea,select,.sugg"))return;
  const row=fg.parentElement;sw={fg,row,x0:ev.clientX,y0:ev.clientY,dir:null,base:row.classList.contains("open")?-96:0,x:null,id:ev.pointerId};
},{passive:true});
document.addEventListener("pointermove",ev=>{
  if(!sw||ev.pointerId!==sw.id)return;const dx=ev.clientX-sw.x0,dy=ev.clientY-sw.y0;
  if(!sw.dir){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;sw.dir=Math.abs(dx)>Math.abs(dy)?"h":"v";if(sw.dir==="h"){sw.fg.style.transition="none";sw.row.classList.add("dragging")}}
  if(sw.dir!=="h")return;sw.x=clamp(sw.base+dx,-130,0);sw.fg.style.transform=`translateX(${sw.x}px)`;
},{passive:true});
function endSwipe(){if(!sw)return;sw.row.classList.remove("dragging");if(sw.dir==="h"){const open=(sw.x??sw.base)<-48;sw.fg.style.transition="";sw.fg.style.transform="";sw.row.classList.toggle("open",open);
  if(open){if(swOpen&&swOpen!==sw.row)swOpen.classList.remove("open");swOpen=sw.row}else if(swOpen===sw.row)swOpen=null;swSuppress=Date.now()}sw=null}
document.addEventListener("pointerup",endSwipe);document.addEventListener("pointercancel",endSwipe);
document.addEventListener("click",ev=>{
  if(Date.now()-swSuppress<350&&!ev.target.closest(".swipe-del")){ev.preventDefault();ev.stopPropagation();return}
  const fg=ev.target.closest(".swipe-fg");if(fg&&fg.parentElement.classList.contains("open")){ev.preventDefault();ev.stopPropagation();closeSwipe()}
},true);
function askDelete(kind,id){
  const curR=S.routines.find(x=>x.id===ui.editRoutine);const curEx=exById(ui.editEx);
  if(kind==="routine"){const r=S.routines.find(x=>x.id===id);if(!r)return;
    confirmBox(`Supprimer « ${r.name} » ?`,"Cette action est irréversible.","Supprimer",()=>{S.routines=S.routines.filter(x=>x.id!==id);save();render()})}
  else if(kind==="item"&&curR){const it=curR.items.find(x=>x.id===id);const ex=it&&exById(it.ex);
    confirmBox(ex?`Retirer « ${ex.name} » ?`:"Retirer cet exercice ?","Il sera retiré de cette routine. Cette action est irréversible.","Retirer",()=>{const i=curR.items.findIndex(x=>x.id===id);const nx=curR.items[i+1];if(nx&&nx.link&&!curR.items[i].link)nx.link=false;curR.items.splice(i,1);if(curR.items[0])curR.items[0].link=false;save();render()})}
  else if(kind==="exercise"){const ex=exById(id);if(!ex)return;const used=routinesUsing(id);
    if(used.length){closeSwipe();alertBox("Exercice utilisé","Il est dans : "+used.map(r=>r.name).join(", ")+". Retire-le de ces routines avant de le supprimer.");return}
    confirmBox(`Supprimer « ${ex.name} » ?`,"Sa fiche sera supprimée. Ton historique de séances reste. Cette action est irréversible.","Supprimer",()=>{S.exercises=S.exercises.filter(e=>e.id!==id);save();render()})}
  else if(kind==="session"){const s=S.sessions.find(x=>x.id===id);if(!s)return;
    confirmBox("Supprimer cette séance ?",`${s.routine}, ${fmtDateShort(s.date)}. Cette action est irréversible.`,"Supprimer",()=>{S.sessions=S.sessions.filter(x=>x.id!==id);if(!S.sessions.some(x=>x.date===ui.calDay))ui.calDay=null;save();render()})}
  else if(kind==="step"&&curEx){const i=+id;
    confirmBox("Supprimer cette étape ?",(curEx.steps[i]&&curEx.steps[i].n)||"Étape "+(i+1),"Supprimer",()=>{curEx.steps.splice(i,1);if(curEx.lvl>=curEx.steps.length)curEx.lvl=Math.max(0,curEx.steps.length-1);else if(i<curEx.lvl)curEx.lvl--;exChanged(curEx,true);render()})}
}

/* ================= suggestions (exercise autocomplete) ================= */
function suggest(input){
  const kind=input.dataset.sugg;const box=kind==="live"?$("#sugg-live"):$("#sugg-"+input.dataset.item);if(!box)return;
  const q=norm(input.value);if(!q){box.hidden=true;box.innerHTML="";return}
  const hits=S.exercises.filter(e=>norm(e.name).includes(q)||e.steps.some(s=>norm(s.n).includes(q))).sort((a,b)=>(norm(a.name).startsWith(q)?0:1)-(norm(b.name).startsWith(q)?0:1)||a.name.localeCompare(b.name,"fr")).slice(0,6);
  const exact=S.exercises.some(e=>norm(e.name)===q);
  box.innerHTML=hits.map(e=>`<button data-act="pick-ex" data-kind="${kind}" data-item="${esc(input.dataset.item||"")}" data-id="${e.id}">${esc(e.name)} <span class="muted" style="font-size:13px">· ${esc(exSub(e))}</span></button>`).join("")
    +(exact?"":`<button class="new" data-act="create-ex" data-kind="${kind}" data-item="${esc(input.dataset.item||"")}" data-name="${esc(input.value.trim())}">+ Créer « ${esc(input.value.trim())} »</button>`);
  box.hidden=false;
}
function assignEx(kind,itemId,exId){
  const ex=exById(exId);if(!ex)return;
  if(kind==="live"&&draft){const link=$("#liveLink")&&$("#liveLink").checked;const nd=buildDraftEx(pseudoItem(),ex);nd.link=!!link&&draft.exercises.length>0;draft.exercises.push(nd);saveDraft();render();return}
  const r=S.routines.find(x=>x.id===ui.editRoutine);const it=r&&r.items.find(x=>x.id===itemId);if(!it)return;
  it.ex=exId;it.auto=ex.prog!=="aucun"&&ex.mode!=="kick";it.since=Date.now();it.pending=null;if(ex.mode==="kick"){it.sets=1;if(it.lo==null){it.lo=20;it.hi=20}}save();render();
}
/* exercise changed in the library: prescriptions restart their 2-session count */
function exChanged(ex,resetCount){if(resetCount)S.routines.forEach(r=>r.items.forEach(i=>{if(i.ex===ex.id){i.since=Date.now();i.pending=null}}));save()}

/* ================= events ================= */
document.addEventListener("click",async ev=>{
  if(ev.target.id==="sheet"){closeSheet();return}
  if(ev.target.id==="modal"){closeModal();return}
  const tb=ev.target.closest("[data-tab]");if(tb){go(tb.dataset.tab);return}
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="m-cancel"){closeModal();return}
  if(a==="m-ok"){const cb=modalCb;closeModal();cb&&cb();return}
  if(a==="swipe-del"){const row=b.closest(".swipe");askDelete(row.dataset.kind,row.dataset.id);return}
  if(a==="start")startSession(b.dataset.id);
  else if(a==="start-free")startSession(null);
  else if(a==="close-bilan"){S.bilan=null;save();render()}
  else if(a==="inc"||a==="dec"){const row=b.closest(".set");const ei=+row.dataset.ei,si=+row.dataset.si,f=b.dataset.f;const s=draft.exercises[ei].sets[si];
    const v=Math.max(0,r2((+s[f]||0)+(a==="inc"?1:-1)*STEP[f]));s[f]=v;saveDraft();const inp=document.getElementById(`in-${ei}-${si}-${f}`);if(inp)inp.value=v}
  else if(a==="done"){const row=b.closest(".set");const ei=+row.dataset.ei,si=+row.dataset.si;const s=draft.exercises[ei].sets[si];
    s.done=!s.done;saveDraft();row.classList.toggle("ok",s.done);b.setAttribute("aria-pressed",s.done);lastNextKey="";if(s.done)onSetDone(ei,si);
    const c=draft.exercises.reduce((x,e)=>x+e.sets.filter(s=>s.done).length,0);const lab=document.getElementById("doneCount");if(lab)lab.textContent=`${c} série${c>1?"s":""} validée${c>1?"s":""}`}
  else if(a==="hist")openHist(b.dataset.name,b.dataset.ex);
  else if(a==="close-sheet")closeSheet();
  else if(a==="pick-ok"){const cb=pickCb;const v=pickValue();closeSheet();cb&&cb(v)}
  else if(a==="lvl-step"){const i=+b.dataset.ei;const de=draft.exercises[i];const ex=exById(de.ex);const f=findItem(de.item);if(!ex||!f)return;
    const nl=clamp(ex.lvl+(+b.dataset.d),0,ex.steps.length-1);if(nl===ex.lvl)return;ex.lvl=nl;exChanged(ex,true);
    const nd=buildDraftEx(f.i,ex);nd.link=de.link;draft.exercises[i]=nd;saveDraft();render();toast(`Étape ${nl+1} : ${stepLabel(ex,nl)}`)}
  else if(a==="undo-lvl"){const i=+b.dataset.ei;const de=draft.exercises[i];const f=findItem(de.item);const ex=exById(de.ex);const p=f&&f.i.pending;
    if(f&&ex&&p&&p.before){const it=f.i;it.kg=p.before.kg;it.lo=p.before.lo;it.hi=p.before.hi;it.ext=p.before.ext||0;if(ex.prog==="etapes"&&p.before.lvl!=null)ex.lvl=p.before.lvl;
      S.routines.forEach(r=>r.items.forEach(o=>{if(o.pending&&o.pending.at===p.at&&o.pending.exId===p.exId)o.pending=null}));save();const nd=buildDraftEx(it,ex);nd.link=de.link;draft.exercises[i]=nd}
    else de.pending=null;saveDraft();render();toast("Niveau précédent conservé.")}
  else if(a==="alt-ext"){const i=+b.dataset.ei;const de=draft.exercises[i];const f=findItem(de.item);const ex=exById(de.ex);const p=f&&f.i.pending;
    if(f&&ex&&p&&p.before){const it=f.i;it.kg=p.before.kg;it.ext=0;const fromT=tgtTxt(tgtOf(it,ex),ex);it.ext=2;
      it.pending=Object.assign({},p,{alt:false,keepPrefill:true,from:fromT+" à "+kgTxt(it.kg,ex.lest),to:tgtTxt(tgtOf(it,ex),ex)+" à "+kgTxt(it.kg,ex.lest)});save();
      const nd=buildDraftEx(it,ex);nd.link=de.link;draft.exercises[i]=nd;saveDraft();render();toast("Objectif +2 reps avant l'haltère suivant.")}}
  else if(a==="wrist"){const v=+b.dataset.v;const wb=document.getElementById("wristBack");const back=!!(wb&&wb.checked);draft.wrist=v;draft.check=false;
    if(v>3||back){const ex=draft.exercises;for(let i=ex.length-1;i>=0;i--)if(ex[i].mode==="kick"){const nx=ex[i+1];if(nx&&nx.link&&!ex[i].link)nx.link=false;ex.splice(i,1)}if(ex[0])ex[0].link=false;
      draft.guard=`Kick-ups retirés aujourd'hui : poignets à ${v}/10${back?", douleur revenue le lendemain":""}. Handstand au mur uniquement.`}
    saveDraft();render();window.scrollTo(0,0)}
  else if(a==="add-set"){const e=draft.exercises[+b.dataset.ei];const p=e.sets[e.sets.length-1];e.sets.push(Object.assign({},p,{done:false}));saveDraft();render()}
  else if(a==="rm-set"){const e=draft.exercises[+b.dataset.ei];if(e.sets.length>1)e.sets.pop();saveDraft();render()}
  else if(a==="rm-ex"){const i=+b.dataset.ei;const ex=draft.exercises;const nx=ex[i+1];if(nx&&nx.link&&!ex[i].link)nx.link=false;ex.splice(i,1);if(ex[0])ex[0].link=false;saveDraft();render()}
  else if(a==="finish")finishSession();
  else if(a==="cancel")confirmBox("Abandonner la séance ?","Rien ne sera enregistré. Cette action est irréversible.","Abandonner",()=>{draft=null;saveDraft();stopTimer();keepAwake(false);render();window.scrollTo(0,0)});
  /* routines */
  else if(a==="edit-r"){ui.editRoutine=b.dataset.id;render();window.scrollTo(0,0)}
  else if(a==="back-r"){const r=S.routines.find(x=>x.id===ui.editRoutine);if(r&&r.items[0])r.items[0].link=false;ui.editRoutine=null;save();render();window.scrollTo(0,0)}
  else if(a==="new-r"){const r={id:uid(),name:"",items:[]};S.routines.push(r);r.items.push(newItem());save();ui.editRoutine=r.id;render();window.scrollTo(0,0);setTimeout(()=>{const i=$("#rname");i&&i.focus()},60)}
  else if(a==="restore-r"){const d=defaultData();const have=new Set(S.routines.map(r=>r.name));const names=new Map(S.exercises.map(e=>[norm(e.name),e]));
    const idMap={};d.exercises.forEach(e=>{const ex=names.get(norm(e.name));if(ex)idMap[e.id]=ex.id;else{S.exercises.push(e);idMap[e.id]=e.id}});
    const add=d.routines.filter(r=>!have.has(r.name));add.forEach(r=>{r.items.forEach(i=>{i.ex=idMap[i.ex]});S.routines.push(r)});save();render();
    toast(add.length?`${add.length} routine${add.length>1?"s":""} ajoutée${add.length>1?"s":""}.`:"Les routines du programme sont déjà là.")}
  else if(a==="it-add"){const r=S.routines.find(x=>x.id===ui.editRoutine);if(!r)return;const it=newItem();r.items.push(it);save();render();setTimeout(()=>{const i=document.querySelector(`.exsearch[data-item="${it.id}"]`);if(i){i.scrollIntoView({block:"center"});i.focus()}},60)}
  else if(a==="it-up"||a==="it-down"){const r=S.routines.find(x=>x.id===ui.editRoutine);if(!r)return;const i=r.items.findIndex(x=>x.id===b.dataset.item);const j=a==="it-up"?i-1:i+1;if(j<0||j>=r.items.length)return;
    [r.items[i],r.items[j]]=[r.items[j],r.items[i]];if(r.items[0])r.items[0].link=false;save();render()}
  else if(a==="sets-inc"||a==="sets-dec"){const f=findItem(b.dataset.item);if(!f)return;f.i.sets=clamp((f.i.sets||1)+(a==="sets-inc"?1:-1),1,20);f.i.since=Date.now();f.i.pending=null;save();b.parentElement.querySelector("span").textContent=f.i.sets}
  else if(a==="rest-pick"){const f=findItem(b.dataset.item);if(!f)return;openRestPicker(f.i.rest,v=>{f.i.rest=v;save();render()})}
  else if(a==="pick-ex"){assignEx(b.dataset.kind,b.dataset.item,b.dataset.id)}
  else if(a==="create-ex"){const name=b.dataset.name;if(!name)return;const ex=E(name,{todo:true});S.exercises.push(ex);save();assignEx(b.dataset.kind,b.dataset.item,ex.id);toast(`« ${name} » ajouté. Complète sa fiche dans Exercices.`)}
  /* exercises */
  else if(a==="edit-ex"){ui.editEx=b.dataset.id;render();window.scrollTo(0,0)}
  else if(a==="back-ex"){ui.editEx=null;save();render();window.scrollTo(0,0)}
  else if(a==="new-ex"){const ex=E("",{todo:true});S.exercises.push(ex);save();ui.editEx=ex.id;render();window.scrollTo(0,0);setTimeout(()=>{const i=$("#xname");i&&i.focus()},60)}
  else if(a==="ex-mode"){const ex=exById(ui.editEx);if(!ex)return;ex.mode=b.dataset.v;
    if(ex.mode==="kick"){ex.load=false;ex.uni=false;ex.prog="aucun"}if(ex.mode!=="sec"&&ex.prog==="duree")ex.prog="signal";if(ex.mode!=="reps")ex.uni=false;exChanged(ex,true);render()}
  else if(a==="step-add"){const ex=exById(ui.editEx);if(!ex)return;ex.steps.push({n:"",lo:null,hi:null});exChanged(ex,false);render();setTimeout(()=>{const ins=document.querySelectorAll('[data-sf="n"]');const i=ins[ins.length-1];i&&i.focus()},60)}
  /* progress & history */
  else if(a==="period"){ui.period=+b.dataset.p;saveUI();render()}
  else if(a==="mprev"||a==="mnext"){const d=parseISO(ui.calMonth);d.setMonth(d.getMonth()+(a==="mnext"?1:-1));ui.calMonth=iso(d);ui.calDay=null;render()}
  else if(a==="day"){ui.calDay=b.dataset.d;render();const h=$("#dayTitle");h&&h.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="export")doExport("json");
  else if(a==="export-csv")doExport("csv");
  else if(a==="copy"){const t=$("#dump");try{await navigator.clipboard.writeText(t.value);toast("Copié.")}catch(e){t.focus();t.select()}}
  else if(a==="import"){const f=$("#importFile");f.value="";f.click()}
  else if(a==="import-no"){importPayload=null;$("#importBox").hidden=true}
  else if(a==="import-ok"&&importPayload){const v=importPayload;importPayload=null;
    const full=Array.isArray(v.exercises)&&Array.isArray(v.routines);
    if(full){S.exercises=v.exercises;S.routines=v.routines;S.sessions=v.sessions}else{const ids=new Set(S.sessions.map(s=>s.id));v.sessions.forEach(s=>{if(!ids.has(s.id))S.sessions.push(s)})}
    S.bilan=null;save();render();toast(`${v.sessions.length} séance${v.sessions.length>1?"s":""} importée${v.sessions.length>1?"s":""}.`)}
  else if(a==="wipe")confirmBox("Tout effacer ?","Toutes les séances seront supprimées. Tes routines et exercices restent. Cette action est irréversible.","Tout effacer",()=>{S.sessions=[];S.bilan=null;ui.calDay=null;S.routines.forEach(r=>r.items.forEach(i=>{i.since=0;i.pending=null}));save();render()});
});
function newItem(){return{id:uid(),ex:null,sets:3,lo:8,hi:12,rest:90,kg:0,link:false,auto:false,note:"",ext:0,since:0,pending:null}}

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.sugg){suggest(t);return}
  if(t.id==="exQ"){ui.exQuery=t.value;swOpen=null;const l=$("#exList");if(l)l.innerHTML=exListHTML();return}
  if(t.id==="rname"){const r=S.routines.find(x=>x.id===ui.editRoutine);if(r){r.name=t.value;save()}return}
  if(t.dataset&&t.dataset.xf&&["name","how","link"].includes(t.dataset.xf)){const ex=exById(ui.editEx);if(!ex)return;
    if(t.dataset.xf==="name"){ex._oldName=ex._oldName??ex.name;ex.name=t.value}else ex[t.dataset.xf]=t.value;if(t.dataset.xf==="how"&&t.value.trim())ex.todo=false;save();return}
  if(t.dataset&&t.dataset.sf==="n"){const ex=exById(ui.editEx);if(!ex)return;ex.steps[+t.dataset.step].n=t.value;save();return}
  if(t.dataset&&t.dataset.item&&t.dataset.f==="note"){const f=findItem(t.dataset.item);if(f){f.i.note=t.value;save()}}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="exoPick"){ui.exo=t.value;saveUI();render();return}
  if(t.id==="importFile"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>handleImport(String(r.result));r.readAsText(t.files[0]);return}
  if(t.matches(".set input")&&draft){const row=t.closest(".set");const s=draft.exercises[+row.dataset.ei].sets[+row.dataset.si];const v=numOrNull(t.value);s[t.dataset.f]=v==null?0:Math.max(0,v);saveDraft();return}
  if(t.dataset.item&&t.dataset.f){const f=findItem(t.dataset.item);if(!f)return;const it=f.i;const k=t.dataset.f;
    if(k==="link"||k==="auto"){it[k]=t.checked;if(k==="auto"){it.since=Date.now();it.pending=null}save();if(k==="link")render();return}
    if(k==="lo"||k==="hi"||k==="kg"){const v=numOrNull(t.value);it[k]=k==="kg"?(v==null?0:Math.max(0,v)):(v==null?null:Math.max(0,Math.round(v)));
      if(k!=="kg"&&it.lo!=null&&it.hi!=null&&it.hi<it.lo)it.hi=it.lo;if(k!=="kg"&&it.lo==null)it.hi=null;if(k!=="kg"&&it.hi==null&&it.lo!=null)it.hi=it.lo;
      it.since=Date.now();it.pending=null;it.ext=0;save();return}
  }
  if(t.dataset.xf){const ex=exById(ui.editEx);if(!ex)return;const k=t.dataset.xf;
    if(k==="name"){const old=ex._oldName;delete ex._oldName;ex.name=t.value.trim()||old||"Sans nom";
      /* keep the history continuous: past sessions logged under the old name follow the rename */
      if(old&&old!==ex.name&&ex.prog!=="etapes")S.sessions.forEach(s=>s.exercises.forEach(e=>{if(e.name===old&&(e.ex===ex.id||!e.ex))e.name=ex.name}));save();render();return}
    if(t.type==="checkbox"){ex[k]=t.checked;if(k==="load"&&!t.checked){ex.lest=false;ex.halt=false;if(ex.prog==="charge")ex.prog="signal"}exChanged(ex,k==="load"||k==="uni");render();return}
    if(k==="prog"){ex.prog=t.value;if(ex.prog==="etapes"&&!ex.steps.length)ex.steps=[{n:ex.name,lo:null,hi:null}];
      S.routines.forEach(r=>r.items.forEach(i=>{if(i.ex===ex.id)i.auto=ex.prog!=="aucun"&&ex.mode!=="kick"}));exChanged(ex,true);render();return}
    if(k==="incr"){ex.incr=Math.max(.25,numOrNull(t.value)||2.5);save();return}
    if(k==="lvl"){ex.lvl=+t.value;exChanged(ex,true);render();return}
  }
  if(t.dataset.sf==="lo"||t.dataset.sf==="hi"){const ex=exById(ui.editEx);if(!ex)return;const s=ex.steps[+t.dataset.step];const v=numOrNull(t.value);s[t.dataset.sf]=v==null?null:Math.max(0,Math.round(v));
    if(s.lo==null)s.hi=null;else if(s.hi==null||s.hi<s.lo)s.hi=s.lo;exChanged(ex,true);return}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){if(!$("#modal").hidden)closeModal();else if(!$("#sheet").hidden)closeSheet()}});
document.addEventListener("focusout",ev=>{const t=ev.target;if(t.dataset&&t.dataset.sugg){setTimeout(()=>{const box=t.dataset.sugg==="live"?$("#sugg-live"):$("#sugg-"+t.dataset.item);if(box&&!box.contains(document.activeElement))box.hidden=true},200)}});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==ui.tab){ui.tab=h;ui.editRoutine=null;ui.editEx=null;render()}});

/* ================= boot ================= */
(function(){const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))ui.tab=h})();
if(draft){ui.tab="enregistrer";keepAwake(true)}
render();showTimer();
})();
</script>
