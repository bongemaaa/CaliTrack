       <div class="sesex">${s.exercises.map((e,k)=>swipeRow("sesex",s.id+"|"+k,`<div class="detail-ex"><b>${esc(e.name)}${e.tempo?` <span class="muted" style="font-weight:500">· ${esc(e.tempo)}</span>`:""}</b><span class="muted">${e.sets.length} série${e.sets.length>1?"s":""}</span><span class="sets-txt">${esc(setsTxt(e))}</span></div>`)).join("")}</div></div>`)}).join("")
      +`<p class="foot">Glisse une séance (par son titre) ou un exercice vers la gauche pour le supprimer.</p>`;
  }
  return `<h1>Historique</h1><div class="stack">
   <div class="tiles"><div class="card tile"><div class="v num">${week}</div><div class="l">séance${week>1?"s":""} cette semaine</div></div>
    <div class="card tile"><div class="v num">${month}</div><div class="l">séance${month>1?"s":""} en ${MONTHS[t.getMonth()]}</div></div>
    <div class="card tile hot"><div class="v num">${streak}</div><div class="l">semaine${streak>1?"s":""} d'affilée</div></div></div>
   <div class="card"><div class="cal-nav"><button class="iconbtn" data-act="mprev" aria-label="Mois précédent">‹</button><h3>${MONTHS[mo]} ${y}</h3><button class="iconbtn" data-act="mnext" aria-label="Mois suivant">›</button></div>
    <div class="cal">${cells}</div></div>

   <div class="card stack">${backupDue()?`<div class="banner">${ui.lastExport?`Dernière sauvegarde le ${fmtDateShort(iso(new Date(ui.lastExport)))}.`:"Aucune sauvegarde pour l'instant."} Tes séances n'existent que sur ce téléphone : sauvegarde-les dans un fichier.</div>`:""}<p class="muted" style="margin:0;font-size:14px">Enregistré sur cet appareil. Exporte régulièrement un fichier de sauvegarde.</p>

/* ================= export / import ================= */
function exportData(){return JSON.stringify({app:"calitrack",version:6,exportedAt:new Date().toISOString(),exercises:S.exercises,routines:S.routines,sessions:S.sessions},null,1)}
function csvData(){
  const nn=v=>v==null||v===""?"":String(v).replace(".",",");const q=s=>{s=String(s??"");return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[["Date","Routine","Exercice","Série","Reps","Reps G","Reps D","Secondes","Charge (kg)","Tentatives","Tenues ≥ 3 s","Meilleure tenue (s)","Tempo"].join(";")];
  sortedSessions().forEach(s=>s.exercises.forEach(e=>e.sets.forEach((x,i)=>{lines.push([s.date,q(s.routine),q(e.name),i+1,nn(x.reps),nn(x.g),nn(x.d),nn(x.sec),nn(x.kg),nn(x.att),nn(x.holds),nn(x.best),q(e.tempo||"")].join(";"))})));
  return{csv:"﻿"+lines.join("\r\n"),rows:lines.length-1};
}
/* backup reminder: sessions logged since the last JSON export, and that export is over 14 days old (or never done) */

/* FLIP: after a deletion re-renders the list, everything that moved slides from where it was to where it is (transform only).

   Rows are keyed by kind|id and measured against their parent, so a row inside a block that moves is not moved twice. */

  [...main.children].forEach((el,i)=>m.set("m"+i+"|"+el.tagName+"|"+el.className,{el,top:el.getBoundingClientRect().top}));
  main.querySelectorAll(".swipe[data-kind]").forEach(el=>m.set("s"+el.dataset.kind+"|"+el.dataset.id,{el,top:el.getBoundingClientRect().top-el.parentElement.getBoundingClientRect().top}));
  /* cards of a .stack (live session): an exercise card by its name, any other card by its rank from the end (stable when a card above goes) */
  main.querySelectorAll(".stack").forEach(st=>{const kids=[...st.children],p=st.getBoundingClientRect().top;kids.forEach((el,i)=>{const nm=el.querySelector(".exname");
    m.set("c"+el.className+"|"+(nm?nm.textContent:"#"+(kids.length-i)),{el,top:el.getBoundingClientRect().top-p})})});
  return m}

    /* a typo (1255 kg for 125,5, 1000 reps) would become the record and pre-fill the next session: ask first */
    const hm=histMax(e.name,f);
    if(hm>0&&v>3*hm&&v!==old){t.value=dec(old);confirmBox("Valeur inhabituelle",`${dec(v)} ${FUNIT[f]||""}, c'est plus de 3 fois ton maximum (${dec(hm)}). La garder ?`,"Garder",()=>{s[f]=v;saveDraft();const i=document.getElementById(t.id);if(i)i.value=dec(v)});return}
    s[f]=v;t.value=dec(v);saveDraft();return}
  if(t.dataset.item&&t.dataset.f){const f=findItem(t.dataset.item);if(!f)return;const it=f.i;const k=t.dataset.f;
    if(k==="link"||k==="auto"){it[k]=t.checked;if(k==="auto"){it.since=Date.now();it.pending=null}save();if(k==="link")render();return}
    if(k==="lo"||k==="hi"||k==="kg"){const v=numOrNull(t.value);it[k]=k==="kg"?(v==null?0:Math.max(0,v)):(v==null?null:Math.max(0,Math.round(v)));
      if(k!=="kg"&&it.lo!=null&&it.hi!=null&&it.hi<it.lo)it.hi=it.lo;if(k!=="kg"&&it.lo==null)it.hi=null;if(k!=="kg"&&it.hi==null&&it.lo!=null)it.hi=it.lo;
      it.since=Date.now();it.pending=null;it.ext=0;save();return}
  }
  if(t.dataset.xf){const ex=exById(ui.editEx);if(!ex)return;const k=t.dataset.xf;
    if(k==="name"){const old=ex._oldName;delete ex._oldName;ex.name=t.value.trim()||old||"Sans nom";
      /* keep the history continuous: past sessions logged under the old name follow the rename */
      if(old&&old!==ex.name&&ex.prog!=="etapes")S.sessions.forEach(s=>s.exercises.forEach(e=>{if(e.name===old&&(e.ex===ex.id||!e.ex))e.name=ex.name}));save();render();return}
    if(t.type==="checkbox"){ex[k]=t.checked;if(k==="load"&&!t.checked){ex.lest=false;ex.halt=false;if(ex.prog==="charge")ex.prog="signal"}exChanged(ex,k==="load"||k==="uni");render();return}
    if(k==="prog"){ex.prog=t.value;if(ex.prog==="etapes"&&!ex.steps.length)ex.steps=[{n:ex.name,lo:null,hi:null}];
      S.routines.forEach(r=>r.items.forEach(i=>{if(i.ex===ex.id)i.auto=ex.prog!=="aucun"&&ex.mode!=="kick"}));exChanged(ex,true);render();return}
    if(k==="incr"){ex.incr=Math.max(.25,numOrNull(t.value)||2.5);save();return}
    if(k==="lvl"){ex.lvl=+t.value;exChanged(ex,true);render();return}
  }
  if(t.dataset.sf==="lo"||t.dataset.sf==="hi"){const ex=exById(ui.editEx);if(!ex)return;const s=ex.steps[+t.dataset.step];const v=numOrNull(t.value);s[t.dataset.sf]=v==null?null:Math.max(0,Math.round(v));
    if(s.lo==null)s.hi=null;else if(s.hi==null||s.hi<s.lo)s.hi=s.lo;exChanged(ex,true);return}
});
/* hide the fixed tab bar and rest timer while the keyboard is up (see body.kb in the CSS) */
const typing=t=>t&&(t.tagName==="TEXTAREA"&&!t.readOnly||t.tagName==="INPUT"&&!/^(checkbox|radio|file|button|submit|range)$/.test(t.type));
document.addEventListener("focusin",ev=>{if(typing(ev.target))document.body.classList.add("kb")});
document.addEventListener("focusout",ev=>{if(typing(ev.target))setTimeout(()=>{if(!typing(document.activeElement))document.body.classList.remove("kb")},0)});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){if(!$("#modal").hidden)closeModal(true);else if(!$("#sheet").hidden)closeSheet()}});
document.addEventListener("focusout",ev=>{const t=ev.target;if(t.dataset&&t.dataset.sugg){setTimeout(()=>{const box=t.dataset.sugg==="live"?$("#sugg-live"):$("#sugg-"+t.dataset.item);if(box&&!box.contains(document.activeElement))box.hidden=true},200)}});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==ui.tab){ui.tab=h;ui.editRoutine=null;ui.editEx=null;render()}});

/* Safari iOS applies :active (press feedback) only when a touchstart listener exists */
document.addEventListener("touchstart",()=>{},{passive:true});

/* ================= boot ================= */
(function(){const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))ui.tab=h})();
if(draft){ui.tab="enregistrer";keepAwake(true)}
render();showTimer();
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
