<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CaliTrack">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.CALITRACK_STANDALONE=true</script>
</head>
<body>
<title>CaliTrack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* CaliTrack — native iOS feel: system font (SF Pro on iPhone), grouped inset lists, one cobalt accent, true-black dark mode.
   Layout: one column, large titles, borderless rounded groups, translucent tab bar, floating rest timer. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#111114; --muted:#6E6E78; --line:#DCDCE3; --track:#EDEDF2;
  --accent:#2457F5; --accent-ink:#FFFFFF; --accent-text:#1E4AD9; --accent-soft:#E7EDFF;
  --good:#18924D; --good-soft:#DCF2E5; --bad:#D9363A; --bad-soft:#FCE4E4;
  --bar:rgba(249,249,251,.86); --scrim:rgba(0,0,0,.35);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#9A9AA3; --line:#38383D; --track:#2C2C2E;
  --accent:#4C7BFF; --accent-ink:#FFFFFF; --accent-text:#7FA0FF; --accent-soft:#18233F;
  --good:#3DD27A; --good-soft:#12301D; --bad:#FF5F63; --bad-soft:#3A1618;
  --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#9A9AA3; --line:#38383D; --track:#2C2C2E;
  --accent:#4C7BFF; --accent-ink:#FFFFFF; --accent-text:#7FA0FF; --accent-soft:#18233F;
  --good:#3DD27A; --good-soft:#12301D; --bad:#FF5F63; --bad-soft:#3A1618;
  --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.35;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-block:4px 210px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 0}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink)}
.brand svg{width:22px;height:22px;color:var(--accent)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--track);color:var(--ink);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.025em;margin:6px 0 16px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;letter-spacing:-.02em;margin:28px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.25;margin:0;min-width:0;overflow-wrap:anywhere}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.01em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.card{background:var(--card);border:0;border-radius:var(--r);padding:14px 16px;min-width:0}
.card.tap{text-align:left;width:100%;display:block;transition:transform .12s ease,background .12s}
.card.tap:active{transform:scale(.985);background:var(--track)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:3px 9px;border-radius:7px;background:var(--track);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--accent-text);margin-right:4px;font-weight:700}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.go{font-weight:600;color:var(--accent-text);font-size:15px;white-space:nowrap}

.btn{min-height:50px;padding:0 18px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent-text);font-weight:600;font-size:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--accent-text)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.small{min-height:38px;padding:0 12px;font-size:15px;border-radius:10px}
.btn:active{opacity:.75}
.btn:disabled{opacity:.4}
.link{background:none;border:0;padding:6px 0;color:var(--accent-text);font-weight:600;font-size:15px}

.banner{border:0;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:14px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:0;color:var(--muted);min-width:0}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .ico{display:grid;place-items:center}

/* Live session */
.sess-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.clock{font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ex .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.tempo{display:inline-flex;align-items:baseline;gap:5px;background:var(--track);color:var(--ink);border-radius:6px;padding:2px 7px;font-weight:600}
.tempo span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tempo b{font-weight:700;font-size:15px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tempo-help{font-size:12px;color:var(--muted);margin-top:4px}
.uni-tag{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:2px 6px;background:var(--track);color:var(--ink)}
.ex .note{font-size:13px;margin-top:6px;color:var(--ink)}
.ex .last{font-size:13px;margin-top:6px;color:var(--accent-text);font-weight:500}
.streak{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px}
.streak.up{background:var(--good-soft);color:var(--good)}
.streak.down{background:var(--bad-soft);color:var(--bad)}
.lvl{margin-top:10px;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.lvl.up{background:var(--accent);color:var(--accent-ink)}
.lvl.down{background:var(--bad-soft);color:var(--bad)}
.lvl .k{font-weight:700;font-size:17px;line-height:1.2}
.lvl .d{font-size:14px;font-weight:500}
.lvl .undo{align-self:flex-start;background:none;border:0;padding:4px 0;color:inherit;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 50px;gap:6px;align-items:center;min-width:0}
.set.uni{grid-template-areas:"n g d ok" "n k k ok";grid-template-rows:50px 50px}
.set.uni .n{grid-area:n}.set.uni .sg{grid-area:g}.set.uni .sd{grid-area:d}.set.uni .sk{grid-area:k}.set.uni .done{grid-area:ok;height:100%}
.set .n{font-weight:600;font-size:15px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;border-radius:10px;overflow:hidden;background:var(--track);height:50px;min-width:0}
.step button{border:0;background:transparent;font-size:22px;font-weight:500;line-height:1;padding:0;color:var(--accent-text)}
.step button:active{background:var(--line)}
.step .v{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.step input{width:100%;border:0;background:transparent;text-align:center;font-weight:700;font-size:20px;padding:0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step small{font-size:10px;color:var(--muted);line-height:1;margin-top:1px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;font-weight:500}
.done{height:50px;border-radius:10px;border:0;background:var(--track);color:var(--muted);display:grid;place-items:center}
.done svg{width:24px;height:24px}
.set.ok .done{background:var(--accent);color:var(--accent-ink)}
.set.ok .step{background:var(--accent-soft)}
.set-tools{display:flex;gap:8px;margin-top:10px}
.set-tools .btn{flex:1}
.scale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.scale button{height:48px;border-radius:10px;border:0;background:var(--track);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.scale button.hi{background:var(--bad-soft);color:var(--bad)}
.guard{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:12px 16px;font-size:14px;font-weight:600}

/* Superset / triset block */
.grp{padding:0;overflow:hidden}
.grp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:12px 16px;background:var(--accent-soft);color:var(--accent-text)}
.grp-tag{font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.grp-sub{font-size:13px;color:var(--ink);opacity:.75}
.member{padding:14px 16px}
.member+.member{border-top:.5px solid var(--line)}
.mlabel{font-weight:700;font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:2px 5px;margin-right:7px;vertical-align:2px;font-variant-numeric:tabular-nums}

/* Rest timer */
.timer{position:fixed;left:0;right:0;z-index:19;bottom:calc(58px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.timer .in{max-width:560px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.timer .next{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:0 4px 8px 0;margin-bottom:8px;border-bottom:.5px solid rgba(127,127,127,.4)}
.timer .next .tempo{background:rgba(127,127,127,.25);color:inherit;flex:none}
.timer .next .tempo span{color:inherit;opacity:.75}
.timer .next .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.timer .mainrow{display:flex;align-items:center;gap:8px}
.timer .t{font-weight:600;font-size:34px;line-height:1;flex:1;min-width:0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer.chain .t{font-size:22px}
.timer .lbl{font-size:12px;opacity:.7;display:block;font-weight:500;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.timer button{min-width:48px;height:44px;border-radius:12px;border:0;background:rgba(127,127,127,.25);color:inherit;font-weight:600;font-size:15px}
.timer.over .in{background:var(--accent);color:var(--accent-ink);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.timer.chain .in{background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.timer .bar{height:4px;border-radius:2px;background:rgba(127,127,127,.3);margin-top:7px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer.over .bar i{background:var(--accent-ink)}

.exname{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.exname::after{content:"›";margin-left:6px;color:var(--muted);font-weight:500}
.lvlnav{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.lvlnav .lv{font-size:13px;font-weight:600;flex:1 1 100%;color:var(--muted)}
.lvlnav .btn{flex:1}
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .in{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:80vh;overflow:auto;
  padding-top:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .in::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.hrow{padding:11px 0;border-top:.5px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:15px}
.hrow:first-of-type{border-top:0}
.hrow .d{font-weight:600}
.hrow .s{grid-column:1/-1;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* Progress */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--track);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;min-height:32px;font-weight:500;font-size:14px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
select.pick{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--card);padding:0 14px;font-weight:600;font-size:17px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.big .v{font-weight:700;font-size:56px;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.big .u{font-weight:600;font-size:20px;color:var(--muted)}
.delta{font-weight:700;font-size:22px;letter-spacing:-.02em}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpi .v{font-weight:700;font-size:28px;line-height:1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-nav h3{font-size:20px;font-weight:700;text-transform:capitalize}
.cal-nav .iconbtn{font-size:22px;color:var(--accent-text);background:transparent}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;max-width:100%;border:0;background:transparent;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.day.out{visibility:hidden}
.day .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.day.has .dot{background:var(--accent)}
.day.today{color:var(--accent-text);font-weight:700}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel .dot{background:var(--accent-ink)}
.day:disabled{color:var(--muted);opacity:.55}
.detail-ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:.5px solid var(--line);font-size:15px}
.detail-ex:first-of-type{border-top:0}
.detail-ex .sets-txt{grid-column:1/-1;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* Summary */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile .v{font-weight:700;font-size:40px;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.2}
.tile.hot{background:var(--accent);color:var(--accent-ink)}
.tile.hot .l{color:inherit;opacity:.85}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-top:.5px solid var(--line);align-items:baseline}
.rec:first-child{border-top:0}
.rec .name{font-weight:500;min-width:0;overflow-wrap:anywhere}
.rec .val{font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.rec .when{font-size:12px;color:var(--muted)}

/* Bilan */
.bl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:.5px solid var(--line);align-items:baseline;font-size:15px}
.bl-row:first-of-type{border-top:0}
.bl-row .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.bl-row .why{grid-column:1/-1;color:var(--muted);font-size:13px}
.verdict{font-weight:700;font-size:13px;white-space:nowrap}
.verdict.up{color:var(--accent-text)}.verdict.down{color:var(--bad)}.verdict.top{color:var(--good)}.verdict.fail{color:var(--bad)}.verdict.mid{color:var(--muted)}

/* Routines editor */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.inp{min-height:44px;border:0;border-radius:10px;background:var(--track);padding:0 12px;width:100%;min-width:0;font-size:16px}
.inp:disabled{opacity:.55}
.ex-edit{border-top:.5px solid var(--line);padding-top:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ex-edit.linked{border-top:1.5px dashed var(--accent)}
.ex-edit .full{grid-column:1/-1}
.ex-edit .tools{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.checks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px}
.check{display:flex;align-items:center;gap:8px;min-height:40px;font-size:15px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.22)}
textarea.dump{width:100%;min-height:140px;border:0;border-radius:10px;background:var(--track);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">

/* Upgrade an exercise to the v2 model (idempotent). Returns old name. */
function upgradeEx(e){
  if(e.prog)return e.name;
  const old=e.name;const m=META[old]||META[stripTempo(old)]||null;
  const tm=String(old||"").match(TEMPO_RE);
  e.tempo=(m&&m.tempo)||(tm?tm[1]:"")||"";
  e.name=stripTempo(old);
  e.link=!!(m&&m.link);
  e.uni=m&&m.uni!=null?m.uni:/G\/D|\/\s*côté/i.test(e.target||"");
  e.tree=(m&&m.tree)||null;
  e.lvl=m&&m.lvl!=null?m.lvl:0;
  e.prog=(m&&m.prog)||(e.tree?"tree":(e.kg>0?"kg":"manuel"));
  e.incr=(m&&m.incr)||2.5;
  e.lest=!!(m&&m.lest);
  e.halt=!!(m&&m.halt);e.ext=0;
  e.auto=!(m&&m.auto===false);
  e.note=(m&&m.note)||"";
  if(m&&m.rest!=null)e.rest=m.rest;
  if(e.tree&&TREES[e.tree])e.name=TREES[e.tree].levels[e.lvl].n;
  e.since=0;e.pending=null;
  return old;
}
function fixLinks(exs){if(exs[0])exs[0].link=false}
/* shift the range of "3×12–15 G/D": lo += dLo, hi += dHi (the rest of the text is kept) */
function shiftTarget(t,dLo,dHi,min){
  return String(t||"").replace(/^(\d+)\s*[×x]\s*(\d+)(?:\s*[–-]\s*(\d+))?/,(m,s,a,b)=>{
    let lo=Math.max(min||1,+a+dLo),hi=Math.max(lo,+(b||a)+dHi);return s+"×"+(lo===hi?lo:lo+"–"+hi)});
}
function effTarget(rx){
  const base=(rx.prog==="tree"&&rx.tree&&TREES[rx.tree]&&TREES[rx.tree].levels[rx.lvl]&&TREES[rx.tree].levels[rx.lvl].t)||rx.target||"";
  return rx.ext?shiftTarget(base,0,rx.ext):base;
}
const isHSWall=rx=>!!rx&&rx.prog==="tree"&&rx.tree==="handstand"&&rx.lvl<=1;

/* parse "3×6–8 G/D" → {sets, lo, hi, prog}; prog=false when the progression engine can't judge it */
function parseTarget(t,mode){
  t=String(t||"");
  let m=t.match(/^(\d+)\s*[×x]\s*(\d+)(?:\s*[–-]\s*(\d+))?/);
  if(m)return{sets:+m[1],lo:+m[2],hi:+(m[3]||m[2]),prog:true};
  m=t.match(/^(\d+)(?:\s*[–-]\s*(\d+))?\s*tentatives/);
  if(m)return{sets:1,lo:+m[1],hi:+(m[2]||m[1]),prog:false};
  m=t.match(/^(\d+)\s*[×x]\s*échec/);
  if(m)return{sets:+m[1],lo:mode==="sec"?15:5,hi:mode==="sec"?15:5,prog:false};
  return{sets:3,lo:mode==="sec"?30:10,hi:mode==="sec"?30:10,prog:false};
}

/* Migrate any state (old local data, imported file, synced data). Idempotent. */
function migrate(st){
  const map={};
  (st.routines||[]).forEach(r=>{(r.exercises||[]).forEach(e=>{const old=upgradeEx(e);map[r.id+"|"+old]=e.id;map[r.id+"|"+e.name]=e.id});fixLinks(r.exercises||[])});
  (st.sessions||[]).forEach(s=>{(s.exercises||[]).forEach(e=>{
    const old=e.name;e.name=newName(old);
    if(!e.rx&&s.routineId){const id=map[s.routineId+"|"+old]||map[s.routineId+"|"+e.name];if(id)e.rx=id}
  })});
  migrateV3(st);migrateV4(st);
  return st;
}
/* v4: automatic level up becomes optional per exercise (off by default for handstand and L-sit) */
function migrateV4(st){
  (st.routines||[]).forEach(r=>{if(r.v4)return;r.v4=true;
    (r.exercises||[]).forEach(e=>{if(e.auto==null)e.auto=!(e.prog==="tree"&&(e.tree==="handstand"||e.tree==="lsit"))})});
}
/* v3: kick-ups logging, holds +5 s, light dumbbells, jump rope. Runs once per routine. */
function migrateV3(st){
  (st.routines||[]).forEach(r=>{
    if(r.v3)return;r.v3=true;
    (r.exercises||[]).forEach(e=>{
      if(e.name==="Kick-ups"&&e.mode!=="kick"){e.mode="kick";e.prog="aucun";e.uni=false}
      if(e.mode==="sec"&&e.prog==="manuel"&&!e.tree)e.prog="duree";
      if(e.halt==null)e.halt=/^(Curls biceps|Élévations latérales)$/.test(e.name);
      if(e.ext==null)e.ext=0;
    });
    if(/^(Mardi|Vendredi) —/.test(r.name)&&!r.exercises.some(e=>e.name==="Corde à sauter")){const c=X("Corde à sauter","sec","8×45 s",30,0);upgradeEx(c);r.exercises.push(c)}
  });
  (st.sessions||[]).forEach(s=>(s.exercises||[]).forEach(e=>{
    if(e.name==="Kick-ups"&&e.mode!=="kick"){e.mode="kick";e.sets=e.sets.map(x=>({att:x.att??x.reps??0}))}
  }));
}

function genDemo(routines){
  let seed=20261027;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const byDow={1:0,2:1,4:2,5:3,0:4};
  const end=new Date(today().getTime()-DAY);const start=new Date(end.getTime()-91*DAY);
  const skipWeek=mondayOf(new Date(start.getTime()+21*DAY)).getTime();
  const out=[];
  for(let t=start.getTime();t<=end.getTime();t+=DAY){
    const d=new Date(t);const r=byDow[d.getDay()];
    if(r===undefined||!routines[r])continue;
    if(mondayOf(d).getTime()===skipWeek)continue;
    if(rnd()>0.86)continue;
    const p=(t-start.getTime())/(end.getTime()-start.getTime());
    const rt=routines[r];
    const st=new Date(d);st.setHours(ri(17,19),ri(0,59));
    const exs=rt.exercises.map(e=>{
      const sp=SPEC[e.name]||{r:[8,10]};const tg=parseTarget(effTarget(e),e.mode);
      if(e.mode==="kick")return{name:e.name,mode:"kick",rx:e.id,uni:false,tempo:"",sets:[{att:tg.lo,holds:Math.max(0,Math.round(1+5*p+(rnd()*2-1))),best:Math.max(1,Math.round(2+3*p))}]};
      const sets=[];
      for(let i=0;i<tg.sets;i++){
        if(sp.k){
          let kg=sp.k[0]+(sp.k[1]-sp.k[0])*p;
          kg=p>0.93?sp.k[1]:Math.min(sp.k[1],Math.round(kg/2.5)*2.5);
          const reps=ri(tg.lo,tg.hi);
          sets.push(e.uni?{g:reps,d:Math.max(1,reps-ri(0,1)),kg}:{reps,kg});
        }else if(sp.s){
          const v=sp.s[0]+(sp.s[1]-sp.s[0])*p+(rnd()*4-2);
          sets.push({sec:Math.max(3,Math.round(v)),kg:0});
        }else{
          const v=Math.max(1,Math.round(sp.r[0]+(sp.r[1]-sp.r[0])*p+(rnd()*2-1)));
          sets.push(e.uni?{g:v,d:Math.max(1,v-ri(0,1)),kg:0}:{reps:v,kg:0});
        }
      }
      return{name:e.name,mode:e.mode,rx:e.id,uni:!!e.uni&&e.mode!=="sec",tempo:e.tempo||"",sets};
    });
    out.push({id:"demo-"+iso(d),date:iso(d),start:st.getTime(),end:st.getTime()+ri(52,78)*60000,
      routine:rt.name,routineId:rt.id,exercises:exs,demo:true,updatedAt:Date.now()});
  }

function queue(key,op){pending=pending.filter(p=>p.k!==key);pending.push({k:key,op:op||"set"});lsSet(PEND,JSON.stringify(pending));scheduleFlush()}
function persist(keys){saveLocal();(keys||[]).forEach(k=>queue(k))}
let flushTimer=null,flushing=null;
function scheduleFlush(){if(!DB)return;clearTimeout(flushTimer);flushTimer=setTimeout(flush,500)}
function bodyFor(k){
  if(k==="routines")return{list:S.routines,updatedAt:S.routinesAt||Date.now()};
  if(k==="meta")return{seeded:S.seeded,demo:S.demo};
  if(k.startsWith("s-")){const s=S.sessions.find(x=>"s-"+x.id===k);return s?JSON.parse(JSON.stringify(s)):null}
  return null;
}
function flush(){
  if(!DB)return Promise.resolve();
  if(flushing)return flushing.then(()=>pending.length?flush():undefined);
  flushing=(async()=>{
    while(pending.length){
      const p=pending[0];
      try{
        const ref=DB.collection("data/users/"+UID).doc(p.k);
        const b=p.op==="del"?null:bodyFor(p.k);
        if(b)await ref.set(b);else await ref.delete();
        pending.shift();lsSet(PEND,JSON.stringify(pending));
      }catch(e){setSync("offline");break}
    }
    if(!pending.length&&DB)setSync("ok");
  })().finally(()=>{flushing=null});

}

async function replaceRemote(){
  if(!DB)return;
  try{
    const snap=await DB.collection("data/users/"+UID).get();
    const keep=new Set(S.sessions.map(s=>"s-"+s.id));
    snap.docs.forEach(d=>{if(d.id.startsWith("s-")&&!keep.has(d.id))queue(d.id,"del")});
  }catch(e){}
  queue("routines");queue("meta");S.sessions.forEach(s=>queue("s-"+s.id));
}
async function initRemote(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    DB=db;UID=id;
    await flush();
    if(pending.length)return;
    const snap=await DB.collection("data/users/"+UID).get();
    if(snap.empty){await replaceRemote();await flush();return}
    let routines=null,meta=null;const remote=[];
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;
      if(d.id==="routines")routines=JSON.parse(JSON.stringify(v));else if(d.id==="meta")meta=v;else if(d.id.startsWith("s-"))remote.push(JSON.parse(JSON.stringify(v)))});
    if(S.demo&&!(meta&&meta.demo)){S.sessions=remote}
    else{
      const map=new Map(remote.map(s=>[s.id,s]));
      let push=[];
      S.sessions.forEach(s=>{const r=map.get(s.id);if(!r||(s.updatedAt||0)>(r.updatedAt||0)){map.set(s.id,s);push.push(s.id)}});
      S.sessions=[...map.values()];push.forEach(id=>queue("s-"+id));
    }
    if(routines&&Array.isArray(routines.list)&&((routines.updatedAt||0)>=(S.routinesAt||0)||S.demo)){S.routines=routines.list;S.routinesAt=routines.updatedAt||0}
    else queue("routines");
    if(meta){S.seeded=true;S.demo=!!meta.demo}
    const before=JSON.stringify(S.routines);migrate(S);if(JSON.stringify(S.routines)!==before)queue("routines");
    saveLocal();setSync("ok");render();
  }catch(e){setSync(DB?"offline":"local")}
}

const kgTxt=(kg,lest)=>(lest&&kg>0?"+":"")+fmt(kg)+" kg";
function setTxt(x,e){
  if(e.mode==="kick")return (x.att??0)+" tentatives"+(x.holds!=null?" · "+x.holds+" tenues ≥ 3 s":"")+(x.best?" · max "+x.best+" s":"");
  if(e.mode==="sec")return x.sec+" s"+(x.kg?" +"+fmt(x.kg)+" kg":"");

}

  if(mode==="kick")return"kick";if(mode==="sec")return"sec";return anyKg?"kg":"reps";
}
function exValue(e,metric){
  let v=null;for(const x of e.sets){const n=metric==="kick"?(x.holds==null?null:+x.holds):metric==="kg"?(x.kg||0):metric==="sec"?(x.sec||0):repsOf(x);if(n===null)continue;if(v===null||n>v)v=n}return v;
}

/* ---------- progressive overload engine ----------
   top  = every planned set reaches the HIGH end of the range (G/D: the weaker side counts), at the current load
   fail = fewer than half of the planned sets reach the LOW end
   2 consecutive "top" → LEVEL UP ; 2 consecutive "fail" → RÉGRESSION.
   Only real sessions logged since the last change of this exercise count. */
function engineTarget(rx){if(!rx||rx.prog==="aucun"||rx.auto===false)return null;const tg=parseTarget(effTarget(rx),rx.mode);return tg.prog?tg:null}
function judge(e,rx,tg){
  const vals=e.sets.map(x=>valOf(x,rx.mode));
  const atLoad=rx.prog!=="kg"||e.sets.every(x=>(+x.kg||0)>=rx.kg-1e-9);
  const nHi=vals.filter(v=>v>=tg.hi).length,nLo=vals.filter(v=>v>=tg.lo).length;
  if(atLoad&&nHi>=tg.sets)return"top";
  if(nLo<Math.ceil(tg.sets/2))return"fail";
  return"mid";
}
function history(rx){
  return sortedSessions().filter(s=>!s.demo&&(s.start||0)>(rx.since||0)).map(s=>({s,e:s.exercises.find(x=>x.rx===rx.id&&x.name===rx.name)})).filter(h=>h.e).reverse();
}
function streakOf(rx){
  const tg=engineTarget(rx);if(!tg||isHSWall(rx))return null;
  const h=history(rx);if(!h.length)return null;
  const j=judge(h[0].e,rx,tg);return j==="mid"?null:j;
}
function applyVerdict(rx,dir,at){
  const before={kg:rx.kg,lvl:rx.lvl,name:rx.name,target:rx.target,ext:rx.ext||0};
  let from="",to="",auto=false,msg="",alt=false;
  if(rx.prog==="tree"&&TREES[rx.tree]){
    const L=TREES[rx.tree].levels;const nl=Math.max(0,Math.min(L.length-1,rx.lvl+(dir==="up"?1:-1)));
    if(nl!==rx.lvl){from=L[rx.lvl].n+(L[rx.lvl].t?" ("+L[rx.lvl].t+")":"");rx.lvl=nl;rx.name=L[nl].n;to=L[nl].n+(L[nl].t?" ("+L[nl].t+")":"");auto=true}
    else msg=dir==="up"?"Dernier niveau de l'arbre atteint : ajoute du lest ou ralentis le tempo.":"Premier niveau de l'arbre : ajoute de l'assistance (élastique, appui).";
  }else if(rx.prog==="kg"&&rx.halt&&rx.ext>0&&dir==="up"){
    /* light dumbbells: the +2 reps step is done, now the next dumbbell */
    from=effTarget(rx)+" à "+kgTxt(rx.kg,rx.lest);rx.ext=0;rx.kg=r2(rx.kg+(rx.incr||1));to=effTarget(rx)+" à "+kgTxt(rx.kg,rx.lest);auto=true;
  }else if(rx.prog==="kg"){
    if(dir==="down")rx.ext=0;
    const nk=Math.max(0,r2(rx.kg+(dir==="up"?1:-1)*(rx.incr||2.5)));
    if(nk!==rx.kg){from=kgTxt(rx.kg,rx.lest);rx.kg=nk;to=kgTxt(nk,rx.lest);auto=true;alt=dir==="up"&&!!rx.halt}
    else msg="Déjà sans charge : passe à une variante plus facile.";
  }else if(rx.prog==="duree"){
    const d=dir==="up"?5:-5;const nt=shiftTarget(rx.target,d,d,5);
    if(nt!==rx.target){from=rx.target;rx.target=nt;to=nt;auto=true}
    else msg="Fourchette minimale atteinte : passe à une variante plus facile.";
  }else{
    msg=dir==="up"?"Augmente la difficulté : lest, tempo plus lent, amplitude plus grande ou variante plus dure.":"Réduis la difficulté : assistance, amplitude réduite ou variante plus facile.";
  }
  rx.since=at;
  rx.pending={dir,auto,from,to,msg,before,alt};
  return rx.pending;
}

function syncTree(rx,lvlBefore){
  S.routines.forEach(r=>r.exercises.forEach(o=>{
    if(o!==rx&&o.prog==="tree"&&o.tree===rx.tree&&o.lvl===lvlBefore){o.lvl=rx.lvl;o.name=rx.name;o.since=rx.since;o.pending=JSON.parse(JSON.stringify(rx.pending))}

}

}

function buildDraftEx(re){
  const tgt=effTarget(re);const tg=parseTarget(tgt,re.mode);
  const uni=!!re.uni&&re.mode==="reps";
  const lp=lastPerf(re.name);
  const fresh=!!re.pending&&!re.pending.keepPrefill;
  const sets=[];
  if(re.mode==="kick"){const p=lp&&lp.e.sets[0];sets.push({att:tg.lo||20,holds:p&&p.holds!=null?p.holds:0,best:p&&p.best!=null?p.best:0,done:false})}
  else for(let i=0;i<tg.sets;i++){
    const p=lp&&!fresh?(lp.e.sets[i]||lp.e.sets[lp.e.sets.length-1]):null;
    const kg=re.prog==="kg"?re.kg:(p?(+p.kg||0):(re.kg||0));
    if(re.mode==="sec")sets.push({sec:p?(p.sec||tg.lo):tg.lo,kg,done:false});
    else if(uni)sets.push({g:p?(p.g??p.reps??tg.lo):tg.lo,d:p?(p.d??p.reps??tg.lo):tg.lo,kg,done:false});
    else sets.push({reps:p?(p.reps??repsOf(p)):tg.lo,kg,done:false});
  }
  return{name:re.name,mode:re.mode,rx:re.id||null,target:tgt,rest:re.rest||90,kg:re.kg||0,tempo:re.tempo||"",uni,link:!!re.link,note:re.note||"",
    pending:re.pending?JSON.parse(JSON.stringify(re.pending)):null,sets};

  const st=new Date(draft.startedAt);

  if(draft.wrist!=null)s.wrist=draft.wrist;

  const ups=res.items.filter(i=>i.verdict==="up").length;
  toast(ups?`Séance enregistrée · ${ups} level up !`:`Séance enregistrée : ${n} série${n>1?"s":""}.`);

/* Apply the 2-session rule to every routine exercise in a just-saved session. */
function runEngine(s,draftExs){
  const items=[];let touched=false;
  const kick=s.exercises.find(x=>x.mode==="kick");
  const kickHolds=kick?Math.max(0,...kick.sets.map(x=>+x.holds||0)):0;
  draftExs.forEach(de=>{
    const rx=de.rx?findRx(de.rx):null;if(!rx)return;
    if(rx.pending){rx.pending=null;touched=true}
    const le=s.exercises.find(x=>x.rx===rx.id&&x.name===rx.name);if(!le)return;
    if(rx.prog==="kg"){const ks=[...new Set(le.sets.map(x=>+x.kg||0))];if(ks.length===1&&ks[0]!==rx.kg){rx.kg=ks[0];rx.since=s.start-1;touched=true}}
    const tg=engineTarget(rx);if(!tg)return;
    const h=history(rx);if(!h.length)return;
    const j=judge(h[0].e,rx,tg);
    const j2=h.length>=2?judge(h[1].e,rx,tg):null;
    const it={name:rx.name,j};
    let dir=null;
    if(isHSWall(rx)){
      /* doc rule: 60 s at the wall AND ≥ 5 free holds ≥ 3 s, in the same session */
      const best=Math.max(0,...le.sets.map(x=>+x.sec||0));
      const ok=best>=60&&kickHolds>=5;
      it.j=ok?"top":(j==="fail"?"fail":"mid");
      it.info=`Mur : meilleure tenue ${best} s sur 60 · kick-ups : ${kick?kickHolds:"non faits"}${kick?" tenues ≥ 3 s sur 5":""}`;
      if(ok)dir="up";else if(j==="fail"&&j2==="fail")dir="down";
    }else{
      if(j==="top"&&j2==="top")dir="up";else if(j==="fail"&&j2==="fail")dir="down";
    }
    if(dir){
      const lb=rx.lvl;Object.assign(it,{verdict:dir},applyVerdict(rx,dir,s.end));touched=true;
      if(rx.prog==="tree"&&it.auto)syncTree(rx,lb);
    }
    items.push(it);
  });
  const order={up:0,down:1,top:2,fail:3,mid:4};
  items.sort((a,b)=>order[a.verdict||a.j]-order[b.verdict||b.j]);
  return{items,touched};
}

  let head;

      <div class="kpis"><div class="kpi"><div class="v num">${last.exercises.length}</div><div class="l">exercices</div></div>

function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chart(pts,t0,t1,metric){
  const W=340,H=210,L=40,R=14,T=14,B=28;
  let vmin=Math.min(...pts.map(p=>p.v)),vmax=Math.max(...pts.map(p=>p.v));
  if(vmax===vmin){vmax+=metric==="kg"?2.5:2;vmin=Math.max(0,vmin-(metric==="kg"?2.5:2))}
  const step=niceStep((vmax-vmin)/3);
  const y0=Math.floor(vmin/step)*step,y1=Math.ceil(vmax/step)*step;
  const Xs=t=>L+(W-L-R)*(t-t0)/(t1-t0),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  let g="";
  for(let v=y0;v<=y1+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--track)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${fmt(v)}</text>`}
  const m=new Date(t0);m.setDate(1);m.setMonth(m.getMonth()+1);
  const months=[];while(m.getTime()<=t1){months.push(new Date(m));m.setMonth(m.getMonth()+1)}
  const every=months.length>4?2:1;
  months.forEach((d,i)=>{const x=Xs(d.getTime());g+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="var(--track)" stroke-width="1" stroke-dasharray="2 3"/>`;if(i%every===0)g+=`<text x="${x}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${MSHORT[d.getMonth()]}</text>`});
  const line=pts.map((p,i)=>(i?"L":"M")+Xs(p.t).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=line+` L${Xs(pts[pts.length-1].t).toFixed(1)} ${H-B} L${Xs(pts[0].t).toFixed(1)} ${H-B} Z`;
  const dots=pts.map(p=>`<circle cx="${Xs(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="var(--card)" stroke="var(--accent)" stroke-width="1.6"/>`).join("");
  const lp=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${metricLabel(metric)} sur la période">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${g}<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)" stroke-width="1.2"/>
    <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}<circle cx="${Xs(lp.t)}" cy="${Y(lp.v)}" r="5.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/></svg>`;
}

function vCalendar(){
  const t=today();

  const byDay={};S.sessions.forEach(s=>{(byDay[s.date]=byDay[s.date]||[]).push(s)});

  let count=0;

       ${s.exercises.map(e=>`<div class="detail-ex"><b>${esc(e.name)}${e.tempo?` <span class="muted" style="font-weight:600">· ${esc(e.tempo)}</span>`:""}</b><span class="muted">${e.sets.length} série${e.sets.length>1?"s":""}</span><span class="sets-txt">${esc(setsTxt(e))}</span></div>`).join("")}
       <button class="btn small danger" data-act="del-s" data-id="${s.id}" style="margin-top:10px">Supprimer cette séance</button></div>`}).join("");
  }else detail=`<p class="muted" style="margin-top:14px">Touche un jour marqué d'un point pour voir la séance.</p>`;
  return `<h1>Calendrier</h1><div class="card">
    <div class="cal-nav"><button class="iconbtn" data-act="mprev" aria-label="Mois précédent">‹</button><h3>${MONTHS[mo]} ${y}</h3><button class="iconbtn" data-act="mnext" aria-label="Mois suivant">›</button></div>
    <div class="cal">${cells}</div>
    <div class="muted" style="font-size:13px;margin-top:10px;text-align:center">${count} jour${count>1?"s":""} d'entraînement ce mois-ci</div></div>
    <div class="stack">${detail}</div>`;
}

/* ===== Résumé ===== */
function vSummary(){
  const t=today();const wk=mondayOf(t).getTime();const mStart=new Date(t.getFullYear(),t.getMonth(),1).getTime();
  const tsOf=s=>parseISO(s.date).getTime();
  const week=S.sessions.filter(s=>tsOf(s)>=wk).length;
  const month=S.sessions.filter(s=>tsOf(s)>=mStart).length;
  const weeks=new Set(S.sessions.map(s=>mondayOf(parseISO(s.date)).getTime()));
  let cur=wk;if(!weeks.has(cur))cur-=7*DAY;let streak=0;
  while(weeks.has(cur)){streak++;const d=new Date(cur);d.setDate(d.getDate()-7);cur=d.getTime()}
  const recs=allExNames().map(n=>{const m=exMetric(n);let best=null;
    sortedSessions().forEach(s=>{const e=s.exercises.find(x=>x.name===n);if(!e)return;const v=recValue(e,m);if(v==null)return;if(best===null||v>best.v)best={v,date:s.date}});
    return{n,m,best}}).filter(r=>r.best);
  return `<h1>Résumé</h1><div class="stack">${demoBanner()}
   <div class="tiles"><div class="card tile"><div class="v num">${week}</div><div class="l">séance${week>1?"s":""} cette semaine</div></div>
    <div class="card tile"><div class="v num">${month}</div><div class="l">séance${month>1?"s":""} en ${MONTHS[t.getMonth()]}</div></div>
    <div class="card tile hot"><div class="v num">${streak}</div><div class="l">semaine${streak>1?"s":""} d'affilée</div></div></div>
   <h2>Records</h2>
   <div class="card">${recs.length?recs.map(r=>`<div class="rec"><span class="name">${esc(r.n)}</span><span class="val">${fmt(r.best.v)} ${r.m==="kick"?"s":unit(r.m)}</span><span class="when">${r.m==="kick"?"Meilleure tenue libre":metricLabel(r.m)} ·${fmtDateShort(r.best.date)} ${parseISO(r.best.date).getFullYear()}</span></div>`).join(""):'<div class="empty">Pas encore de record.</div>'}</div>
   <h2>Mes données</h2>
   <div class="card stack"><p class="muted" id="syncTxt" style="margin:0;font-size:14px">${syncLabel()}</p>
    <button class="btn block" data-act="export">Sauvegarder dans un fichier</button>
    <button class="btn block" data-act="export-csv">Exporter pour Excel ou Sheets (CSV)</button>
    <div id="dumpBox" hidden></div>
    <button class="btn block" data-act="import">Importer un fichier de sauvegarde</button>
    <div id="importBox" hidden></div>
    <button class="btn danger block" data-act="wipe" id="wipeBtn">Tout effacer</button>
    <p class="muted" style="margin:0;font-size:12px">« Tout effacer » supprime toutes les séances (exemples compris). Tes routines et leurs niveaux restent.</p></div></div>`;
}
function exportData(){return JSON.stringify({app:"calitrack",version:4,exportedAt:new Date().toISOString(),routines:S.routines,sessions:S.sessions},null,1)}
/* one row per set; ";" separator and decimal comma for Excel in French, BOM so accents open correctly */
function csvData(){
  const n=v=>v==null||v===""?"":String(v).replace(".",",");
  const q=s=>{s=String(s??"");return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[["Date","Routine","Exercice","Série","Reps","Reps G","Reps D","Secondes","Charge (kg)","Tentatives","Tenues ≥ 3 s","Meilleure tenue (s)","Tempo"].join(";")];
  sortedSessions().filter(s=>!s.demo).forEach(s=>s.exercises.forEach(e=>e.sets.forEach((x,i)=>{
    lines.push([s.date,q(s.routine),q(e.name),i+1,n(x.reps),n(x.g),n(x.d),n(x.sec),n(x.kg),n(x.att),n(x.holds),n(x.best),q(e.tempo||"")].join(";"))})));
  return{csv:"﻿"+lines.join("\r\n"),rows:lines.length-1};
}
async function doExport(kind){
  let data,name;
  if(kind==="csv"){const c=csvData();if(!c.rows){toast("Aucune séance réelle à exporter (les exemples sont exclus).");return}data=c.csv;name="calitrack-"+iso(today())+".csv"}
  else{data=exportData();name="calitrack-"+iso(today())+".json"}
  if(!window.claude){
    /* installed app on iPhone: iOS share sheet ("Enregistrer dans Fichiers"), else a plain download */
    const type=kind==="csv"?"text/csv":"application/json";
    try{const f=new File([data],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast("Fichier prêt : "+name);return}catch(e){}
  }
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data});toast("Sauvegarde enregistrée.");return}catch(e){if(e&&e.code==="declined")return}}
  const box=$("#dumpBox");if(!box)return;box.hidden=false;
  box.innerHTML=`<p class="muted" style="font-size:13px;margin:0 0 6px">Le téléchargement n'est pas disponible ici. Copie ce texte et colle-le dans un fichier nommé ${esc(name)}.</p><textarea class="dump" id="dump" readonly aria-label="Données exportées">${esc(data)}</textarea><button class="btn small" data-act="copy" style="margin-top:6px">Copier</button>`;
}
let importPayload=null;
function handleImport(text){
  const box=$("#importBox");box.hidden=false;
  try{
    const v=JSON.parse(text);
    if(!v||!Array.isArray(v.sessions))throw new Error();
    if(!v.sessions.every(s=>s&&s.id&&s.date&&Array.isArray(s.exercises)))throw new Error();
    importPayload=v;
    box.innerHTML=`<div class="banner">Fichier lu : <b>${v.sessions.length} séance${v.sessions.length>1?"s":""}</b>${Array.isArray(v.routines)?`, ${v.routines.length} routines`:""}. Il remplacera les données actuelles.</div>
     <div class="row" style="margin-top:8px"><button class="btn primary small" data-act="import-ok" style="flex:1">Remplacer mes données</button><button class="btn small" data-act="import-no">Annuler</button></div>`;
  }catch(e){importPayload=null;box.innerHTML=`<div class="banner">Ce fichier n'est pas une sauvegarde CaliTrack. Choisis le fichier .json créé par « Sauvegarder dans un fichier ».</div>`}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  if(ev.target.id==="sheet"){closeSheet();return}
  const tb=ev.target.closest("[data-tab]");if(tb){go(tb.dataset.tab);return}
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="start")startSession(b.dataset.id);
  else if(a==="start-free")startSession(null);
  else if(a==="close-bilan"){S.bilan=null;saveLocal();render()}
  else if(a==="inc"||a==="dec"){
    const row=b.closest(".set");const ei=+row.dataset.ei,si=+row.dataset.si,f=b.dataset.f;
    const s=draft.exercises[ei].sets[si];let v=(+s[f]||0)+(a==="inc"?1:-1)*STEP[f];
    v=Math.max(0,r2(v));s[f]=v;saveDraft();
    const inp=document.getElementById(`in-${ei}-${si}-${f}`);if(inp)inp.value=v;
  }
  else if(a==="done"){
    const row=b.closest(".set");const ei=+row.dataset.ei,si=+row.dataset.si;const s=draft.exercises[ei].sets[si];
    s.done=!s.done;saveDraft();row.classList.toggle("ok",s.done);b.setAttribute("aria-pressed",s.done);
    lastNextKey="";
    if(s.done)onSetDone(ei,si);
    const c=draft.exercises.reduce((x,e)=>x+e.sets.filter(s=>s.done).length,0);
    const lab=document.getElementById("doneCount");if(lab)lab.textContent=`${c} série${c>1?"s":""} validée${c>1?"s":""}`;
  }
  else if(a==="undo-lvl"){
    const i=+b.dataset.ei;const de=draft.exercises[i];const rx=de.rx?findRx(de.rx):null;const p=de.pending;
    if(rx&&p&&p.before){rx.kg=p.before.kg;rx.lvl=p.before.lvl;rx.name=p.before.name;if(p.before.target!=null)rx.target=p.before.target;rx.ext=p.before.ext||0;rx.pending=null;routinesChanged();
      const nd=buildDraftEx(rx);nd.link=de.link;draft.exercises[i]=nd;}
    else de.pending=null;
    saveDraft();render();toast("Niveau précédent conservé.");
  }
  else if(a==="hist")openHist(b.dataset.name);
  else if(a==="close-sheet")closeSheet();
  else if(a==="lvl-step"){
    const i=+b.dataset.ei;const de=draft.exercises[i];const rx=de.rx?findRx(de.rx):null;if(!rx||!TREES[rx.tree])return;
    const L=TREES[rx.tree].levels;const lb=rx.lvl;const nl=Math.max(0,Math.min(L.length-1,lb+(+b.dataset.d)));if(nl===lb)return;
    rx.lvl=nl;rx.name=L[nl].n;rx.since=Date.now();rx.pending=null;syncTree(rx,lb);routinesChanged();
    const nd=buildDraftEx(rx);nd.link=de.link;draft.exercises[i]=nd;saveDraft();render();
    toast(`Niveau ${nl+1} : ${L[nl].n}${L[nl].t?" ("+L[nl].t+")":""}`);
  }
  else if(a==="alt-ext"){
    const i=+b.dataset.ei;const de=draft.exercises[i];const rx=de.rx?findRx(de.rx):null;const p=rx&&rx.pending;
    if(rx&&p&&p.before){rx.kg=p.before.kg;rx.ext=2;
      rx.pending=Object.assign({},p,{alt:false,keepPrefill:true,from:rx.target+" à "+kgTxt(rx.kg,rx.lest),to:effTarget(rx)+" à "+kgTxt(rx.kg,rx.lest)});
      routinesChanged();const nd=buildDraftEx(rx);nd.link=de.link;draft.exercises[i]=nd;saveDraft();render();toast("Objectif +2 reps avant l'haltère suivant.")}
  }
  else if(a==="wrist"){
    const v=+b.dataset.v;const wb=document.getElementById("wristBack");const back=!!(wb&&wb.checked);
    draft.wrist=v;draft.check=false;
    if(v>3||back){
      const ex=draft.exercises;
      for(let i=ex.length-1;i>=0;i--)if(ex[i].mode==="kick"){const nx=ex[i+1];if(nx&&nx.link&&!ex[i].link)nx.link=false;ex.splice(i,1)}
      if(ex[0])ex[0].link=false;
      draft.guard=`Kick-ups retirés aujourd'hui : poignets à ${v}/10${back?", douleur revenue le lendemain":""}. Handstand au mur uniquement.`;
    }
    saveDraft();render();window.scrollTo(0,0);
  }
  else if(a==="add-set"){const e=draft.exercises[+b.dataset.ei];const p=e.sets[e.sets.length-1];e.sets.push(newSetFrom(e,p));saveDraft();render()}
  else if(a==="rm-set"){const e=draft.exercises[+b.dataset.ei];if(e.sets.length>1)e.sets.pop();saveDraft();render()}
  else if(a==="rm-ex"){const i=+b.dataset.ei;const ex=draft.exercises;const nx=ex[i+1];if(nx&&nx.link&&!ex[i].link)nx.link=false;ex.splice(i,1);if(ex[0])ex[0].link=false;saveDraft();render()}
  else if(a==="add-ex"){
    const name=($("#newEx").value||"").trim();if(!name){$("#newEx").focus();return}
    const mv=$("#newExMode").value;const link=$("#newExLink").checked;
    const known=S.routines.flatMap(r=>r.exercises).find(e=>e.name===name);
    const lp=lastPerf(name);
    const src=known?Object.assign({},known,{id:null,pending:null}):{name,mode:lp?lp.e.mode:(mv==="sec"?"sec":"reps"),uni:lp?!!lp.e.uni:mv==="uni",target:"",rest:90,kg:0,tempo:"",prog:"aucun"};
    const nd=buildDraftEx(src);nd.link=link&&draft.exercises.length>0;
    draft.exercises.push(nd);saveDraft();render();
  }
  else if(a==="finish")finishSession();
  else if(a==="cancel"){
    if(b.classList.contains("armed")){draft=null;saveDraft();stopTimer();keepAwake(false);render();window.scrollTo(0,0);return}
    b.classList.add("armed");b.textContent="Touche encore pour abandonner (rien ne sera enregistré)";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Abandonner la séance"}},4000);
  }
  /* routines */
  else if(a==="edit-r"){ui.editRoutine=b.dataset.id;render();window.scrollTo(0,0)}
  else if(a==="back-r"){const r=S.routines.find(x=>x.id===ui.editRoutine);if(r)fixLinks(r.exercises);ui.editRoutine=null;routinesChanged();render();window.scrollTo(0,0)}
  else if(a==="new-r"){const r={id:uid(),name:"Nouvelle routine",exercises:[blankEx()]};S.routines.push(r);routinesChanged();ui.editRoutine=r.id;render();window.scrollTo(0,0);setTimeout(()=>{const i=$("#rname");i&&i.select()},50)}
  else if(a==="restore-r"){
    const have=new Set(S.routines.map(r=>r.name));const add=defaultRoutines().filter(r=>!have.has(r.name));
    S.routines.push(...add);routinesChanged();render();toast(add.length?`${add.length} routine${add.length>1?"s":""} ajoutée${add.length>1?"s":""}.`:"Les routines du programme sont déjà là.");
  }
  else if(a==="del-r"){
    if(b.classList.contains("armed")){S.routines=S.routines.filter(r=>r.id!==ui.editRoutine);ui.editRoutine=null;routinesChanged();render();toast("Routine supprimée. Ses séances passées restent.");return}
    b.classList.add("armed");b.textContent="Touche encore pour supprimer";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Supprimer la routine"}},4000);
  }
  else if(a.startsWith("x-")){
    const r=S.routines.find(x=>x.id===ui.editRoutine);if(!r)return;
    if(a==="x-add"){r.exercises.push(blankEx());routinesChanged();render();setTimeout(()=>{const i=document.getElementById("xn-"+(r.exercises.length-1));i&&i.focus()},50);return}
    const i=+b.closest(".ex-edit").dataset.xi;
    if(a==="x-del"){const nx=r.exercises[i+1];if(nx&&nx.link&&!r.exercises[i].link)nx.link=false;r.exercises.splice(i,1)}
    if(a==="x-up"&&i>0)[r.exercises[i-1],r.exercises[i]]=[r.exercises[i],r.exercises[i-1]];
    if(a==="x-down"&&i<r.exercises.length-1)[r.exercises[i+1],r.exercises[i]]=[r.exercises[i],r.exercises[i+1]];
    fixLinks(r.exercises);routinesChanged();render();
  }
  /* progress */
  else if(a==="period"){ui.period=+b.dataset.p;saveUI();render()}
  /* calendar */
  else if(a==="mprev"||a==="mnext"){const d=parseISO(ui.calMonth);d.setMonth(d.getMonth()+(a==="mnext"?1:-1));ui.calMonth=iso(d);ui.calDay=null;render()}
  else if(a==="day"){ui.calDay=b.dataset.d;render();const h=document.querySelector("#main h2");h&&h.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="del-s"){
    if(b.classList.contains("armed")){const id=b.dataset.id;S.sessions=S.sessions.filter(s=>s.id!==id);saveLocal();queue("s-"+id,"del");if(!S.sessions.some(s=>s.date===ui.calDay))ui.calDay=null;render();toast("Séance supprimée.");return}
    b.classList.add("armed");b.textContent="Touche encore pour supprimer";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Supprimer cette séance"}},4000);
  }
  /* data */
  else if(a==="export")doExport("json");
  else if(a==="export-csv")doExport("csv");
  else if(a==="copy"){const t=$("#dump");try{await navigator.clipboard.writeText(t.value);toast("Copié.")}catch(e){t.focus();t.select()}}
  else if(a==="import"){const f=$("#importFile");f.value="";f.click()}
  else if(a==="import-no"){importPayload=null;$("#importBox").hidden=true}
  else if(a==="import-ok"&&importPayload){
    const v=importPayload;importPayload=null;
    S.sessions=v.sessions.map(s=>Object.assign({},s,{updatedAt:Date.now()}));
    if(Array.isArray(v.routines)&&v.routines.length){S.routines=v.routines;S.routinesAt=Date.now()}
    S.demo=false;S.seeded=true;S.bilan=null;migrate(S);saveLocal();await replaceRemote();render();toast(`${S.sessions.length} séances importées.`);
  }
  else if(a==="wipe"){
    if(b.classList.contains("armed")){S.sessions=[];S.demo=false;S.seeded=true;S.bilan=null;ui.calDay=null;saveLocal();await replaceRemote();render();toast("Toutes les séances ont été effacées.");return}
    b.classList.add("armed");b.textContent="Touche encore pour tout effacer";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Tout effacer"}},4000);
  }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="exoPick"){ui.exo=t.value;saveUI();render();return}
  if(t.id==="importFile"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>handleImport(String(r.result));r.readAsText(t.files[0]);return}
  if(t.matches(".set input")&&draft){const row=t.closest(".set");const s=draft.exercises[+row.dataset.ei].sets[+row.dataset.si];const v=parseFloat(String(t.value).replace(",","."));s[t.dataset.f]=isNaN(v)?0:Math.max(0,v);saveDraft();return}
  if(t.dataset.x){
    const r=S.routines.find(x=>x.id===ui.editRoutine);if(!r)return;const e=r.exercises[+t.closest(".ex-edit").dataset.xi];const k=t.dataset.x;
    let rerender=false;
    if(t.type==="checkbox"){e[k]=t.checked;rerender=k==="link";if(k==="auto"){e.pending=null;e.since=Date.now()}}
    else if(k==="rest")e.rest=Math.max(0,parseInt(t.value)||0);
    else if(k==="kg"||k==="incr"){e[k]=Math.max(0,parseFloat(String(t.value).replace(",","."))||0);if(k==="kg"){e.since=Date.now();e.pending=null}}
    else if(k==="prog"){const v=t.value;e.pending=null;e.since=Date.now();
      if(v.startsWith("tree:")){const tr=v.slice(5);e.prog="tree";if(e.tree!==tr){e.tree=tr;e.lvl=0;e.mode=TREES[tr].mode;if(TREES[tr].uni)e.uni=true}e.name=TREES[tr].levels[e.lvl].n}
      else{if(e.prog==="tree")e.tree=null;e.prog=v}
      rerender=true}
    else if(k==="lvl"){e.lvl=+t.value;e.name=TREES[e.tree].levels[e.lvl].n;e.pending=null;e.since=Date.now();rerender=true}
    else if(k==="mode"){e.mode=t.value;rerender=true}
    else if(k==="target"){e.target=t.value;e.since=Date.now()}
    else if(k==="name"){e.name=t.value}
    else e[k]=t.value;
    fixLinks(r.exercises);routinesChanged();if(rerender)render();
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="rname"){const r=S.routines.find(x=>x.id===ui.editRoutine);if(r){r.name=t.value||"Sans nom";routinesChanged()}}
  else if(t.dataset&&t.dataset.x==="name"){const r=S.routines.find(x=>x.id===ui.editRoutine);if(r){r.exercises[+t.closest(".ex-edit").dataset.xi].name=t.value;routinesChanged()}}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==ui.tab){ui.tab=h;render()}});

/* ---------- boot ---------- */
(function(){const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))ui.tab=h})();
if(draft){ui.tab="enregistrer";keepAwake(true)}
saveLocal();
render();showTimer();
initRemote();
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
